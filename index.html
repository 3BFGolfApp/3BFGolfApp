    function selectCourseByName(name, teeName){
      const preset = COURSE_PRESETS[name];
      if (!preset) return;
      state.courseName = name;
      state.holes = preset.holes.map(h=>({...h}));
      state.selectedTee = teeName || (preset.tees && preset.tees[0] ? preset.tees[0].name : null);
      if (state.numHoles > state.holes.length) state.numHoles = state.holes.length;
    }

    function renderResultsBox(){
      resultsBox.innerHTML = '';

      if (state.courseSearchSubmitted){
        const q = state.courseSearch.trim().toLowerCase();
        const matches = Object.keys(COURSE_PRESETS).filter(name => name.toLowerCase().includes(q));
        if (matches.length === 0){
          resultsBox.innerHTML = `<div class="hint" style="margin:0 0 16px;">No saved course matches "${escapeHtml(state.courseSearch)}". You can type any course into the Par &amp; Stroke Index table below by hand.</div>`;
          return;
        }
        const label = document.createElement('div');
        label.className = 'hint';
        label.style.margin = '0 0 6px';
        label.textContent = 'Saved Courses';
        resultsBox.appendChild(label);
        matches.forEach(name=>{
          const holeCount = COURSE_PRESETS[name].holes.length;
          const row = buildResultRow(
            name, `${holeCount} holes`,
            state.courseName === name,
            ()=>{ selectCourseByName(name); state.courseSearchSubmitted = false; render(); }
          );
          resultsBox.appendChild(row);
        });
        return;
      }

      // Browse list: every favourite, highlighting whichever is currently selected
      if (state.favourites.length === 0) return;
      const label = document.createElement('div');
      label.className = 'hint';
      label.style.margin = '0 0 6px';
      label.textContent = 'Favourites';
      resultsBox.appendChild(label);
      state.favourites.forEach(f=>{
        const selected = state.courseName === f.courseName && state.selectedTee === f.teeName;
        const row = buildResultRow(
          f.courseName, f.teeName, selected,
          ()=>{ selectCourseByName(f.courseName, f.teeName); render(); }
        );
        resultsBox.appendChild(row);
      });
    }

    function buildResultRow(title, subtitle, selected, onSelect){
      const row = document.createElement('button');
      row.type = 'button';
      row.style.display = 'flex';
      row.style.justifyContent = 'space-between';
      row.style.alignItems = 'center';
      row.style.width = '100%';
      row.style.textAlign = 'left';
      row.style.padding = '11px 12px';
      row.style.marginBottom = '6px';
      row.style.border = '1.5px solid ' + (selected ? 'var(--turf)' : 'var(--line)');
      row.style.borderRadius = '8px';
      row.style.background = selected ? 'var(--turf-light)' : '#fff';
      row.style.cursor = 'pointer';
      row.innerHTML = `<span style="font-weight:${selected ? '700':'500'};color:var(--ink);">${escapeHtml(title)}</span><span style="font-size:12px;color:var(--ink-soft);">${escapeHtml(subtitle)}${selected ? ' · Selected' : ''}</span>`;
      row.onclick = onSelect;
      return row;
    }

    function renderDropdown(){
      const q = state.courseSearch.trim().toLowerCase();
      dropdown.innerHTML = '';
      if (q.length < 3){
        dropdown.style.display = 'none';
        return;
      }
      const matches = state.favourites.filter(f =>
        f.courseName.toLowerCase().includes(q) || f.teeName.toLowerCase().includes(q)
      );
      if (matches.length === 0){
        dropdown.style.display = 'none';
        return;
      }
      matches.forEach(f=>{
        const item = document.createElement('div');
        item.style.padding = '10px 12px';
        item.style.cursor = 'pointer';
        item.style.borderBottom = '1px solid var(--line)';
        item.innerHTML = `<span style="font-weight:600;color:var(--ink);font-size:13.5px;">${escapeHtml(f.courseName)}</span><br><span style="font-size:11.5px;color:var(--ink-soft);">${escapeHtml(f.teeName)}</span>`;
        // mousedown (not click) fires before the input's blur, so the selection
        // registers before the dropdown gets a chance to close on blur.
        item.onmousedown = (e)=>{
          e.preventDefault();
          selectCourseByName(f.courseName, f.teeName);
          state.courseSearch = '';
          dropdown.style.display = 'none';
          render();
        };
        dropdown.appendChild(item);
      });
      dropdown.lastChild.style.borderBottom = 'none';
      dropdown.style.display = 'block';
    }

    searchInput.oninput = (e)=>{
      state.courseSearch = e.target.value;
      state.courseSearchSubmitted = false;
      // Update only the dropdown, not the whole page, so the field keeps focus while typing.
      renderDropdown();
    };
    searchInput.onfocus = ()=>{ renderDropdown(); };
    searchInput.onblur = ()=>{ setTimeout(()=>{ dropdown.style.display = 'none'; }, 100); };
    searchInput.onkeydown = (e)=>{ if (e.key === 'Enter'){ e.preventDefault(); state.courseSearchSubmitted = true; dropdown.style.display = 'none'; render(); } };

    renderResultsBox();

    // Heart + name header at the top of the current course's details
    const detailsHeader = document.createElement('div');
    detailsHeader.style.display = 'flex';
    detailsHeader.style.alignItems = 'center';
    detailsHeader.style.justifyContent = 'space-between';
    detailsHeader.style.marginTop = '20px';
    detailsHeader.style.marginBottom = '4px';
    const isFav = state.favouriteCourses.some(f => f.courseName === state.courseName && f.teeName === state.selectedTee);
    detailsHeader.innerHTML = `<span style="font-weight:700;font-size:14.5px;color:var(--ink);">${escapeHtml(state.courseName)}</span>`;
    const heartBtn = document.createElement('button');
    heartBtn.type = 'button';
    heartBtn.setAttribute('aria-label', isFav ? 'Remove from favourites' : 'Add to favourites');
    heartBtn.style.background = 'transparent';
    heartBtn.style.border = 'none';
    heartBtn.style.cursor = 'pointer';
    heartBtn.style.padding = '2px';
    heartBtn.style.display = 'flex';
    const heartFill = isFav ? '#E091A8' : 'none';
    const heartStroke = isFav ? '#E091A8' : 'var(--ink-soft)';
    heartBtn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="${heartFill}" stroke="${heartStroke}" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20.5s-7.2-4.6-9.9-8.6C.5 9 1.2 5.2 4.3 3.6c2.4-1.2 5.2-.4 6.7 1.7.4.5.7 1 1 1.5.3-.5.6-1 1-1.5 1.5-2.1 4.3-2.9 6.7-1.7 3.1 1.6 3.8 5.4 2.2 8.3-2.7 4-9.9 8.6-9.9 8.6z"/></svg>`;
    heartBtn.onclick = ()=>{
      const idx = state.favouriteCourses.findIndex(f => f.courseName === state.courseName && f.teeName === state.selectedTee);
      if (idx >= 0) state.favouriteCourses.splice(idx, 1);
      else state.favouriteCourses.push({ courseName: state.courseName, teeName: state.selectedTee });
      saveCourseFavourites();
      render();
    };
    detailsHeader.appendChild(heartBtn);
    wrap.appendChild(detailsHeader);

    // Tee + Round length, side by side — with a single compact caption line
    // underneath showing yardage and hole count together instead of each on
    // their own row.
    const currentPreset = COURSE_PRESETS[state.courseName];
    const teeHolesRow = document.createElement('div');
    teeHolesRow.className = 'row2';

    let chosenTee = null;
    if (currentPreset && currentPreset.tees && currentPreset.tees.length){
      const teeField = document.createElement('div');
      teeField.className = 'field';
      teeField.style.flex = '2.4';
      teeField.innerHTML = `<label>Tee</label>`;
      const teeSel = document.createElement('select');
      currentPreset.tees.forEach(tee=>{
        const opt = document.createElement('option');
        opt.value = tee.name;
        opt.textContent = tee.name;
        if (state.selectedTee === tee.name) opt.selected = true;
        teeSel.appendChild(opt);
      });
      teeSel.onchange = (e)=>{
        state.selectedTee = e.target.value;
        render();
      };
      teeField.appendChild(teeSel);
      teeHolesRow.appendChild(teeField);
      chosenTee = currentPreset.tees.find(t=>t.name === state.selectedTee);
    }

    // Holes count
    const holesField = document.createElement('div');
    holesField.className = 'field';
    holesField.style.flex = '0 0 auto';
    holesField.style.width = '112px';
    holesField.innerHTML = `<label>Round length</label>`;
    const sel = document.createElement('select');
    [9,18].forEach(n=>{
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n + ' holes';
      if (state.numHoles === n) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = (e)=>{ state.numHoles = parseInt(e.target.value); render(); };
    holesField.appendChild(sel);
    teeHolesRow.appendChild(holesField);
    wrap.appendChild(teeHolesRow);

    // One compact caption combining tee swatch + yardage + hole count
    const captionRow = document.createElement('div');
    captionRow.style.display = 'flex';
    captionRow.style.alignItems = 'center';
    captionRow.style.gap = '6px';
    captionRow.style.marginTop = '-10px';
    captionRow.style.marginBottom = '16px';
    let captionHtml = '';
    if (chosenTee){
      captionHtml += `<span style="width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);background:${chosenTee.swatch};display:inline-block;flex-shrink:0;"></span>`;
      captionHtml += `<span class="hint" style="margin:0;">${chosenTee.yardage ? chosenTee.yardage + ' yds' : 'Yardage not on file'} · ${state.numHoles} holes</span>`;
    } else {
      captionHtml += `<span class="hint" style="margin:0;">${state.numHoles} holes</span>`;
    }
    captionRow.innerHTML = captionHtml;
    wrap.appendChild(captionRow);

    // Start Round — sits below tee selection, above the Par/SI scorecard table
    if (state.players.length > 0){
      const startBtn = document.createElement('button');
      startBtn.className = 'btn btn-primary';
      startBtn.style.marginTop = '4px';
      startBtn.style.marginBottom = '22px';
      startBtn.textContent = 'Start Round →';
      startBtn.onclick = ()=>{ state.tab = 'play'; state.currentHole = 0; render(); };
      wrap.appendChild(startBtn);
    }

    // Course table
    const title = document.createElement('div');
    title.className = 'section-title';
    title.style.marginTop = '0';
    title.textContent = 'Par & Stroke Index';
    wrap.appendChild(title);

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Edit these to match your scorecard. Stroke index (SI) ranks holes 1–' + state.numHoles + ' by difficulty — 1 is hardest, gets strokes first.';
    wrap.appendChild(hint);

    const hasNames = state.holes.some(h => h.name);
    const table = document.createElement('table');
    table.className = 'course';
    const thead = document.createElement('tr');
    thead.innerHTML = '<th>Hole</th>' + (hasNames ? '<th style="text-align:left">Name</th>' : '') + '<th>Par</th><th>SI</th>';
    table.appendChild(thead);
    for (let i = 0; i < state.numHoles; i++){
      const tr = document.createElement('tr');
      const tdNum = document.createElement('td');
      tdNum.textContent = i+1;
      tr.appendChild(tdNum);
      if (hasNames){
        const tdName = document.createElement('td');
        tdName.style.textAlign = 'left';
        tdName.style.fontWeight = '400';
        tdName.style.color = 'var(--ink-soft)';
        tdName.textContent = state.holes[i].name || '';
        tr.appendChild(tdName);
      }
      const tdPar = document.createElement('td');
      const parInput = document.createElement('input');
      parInput.type = 'number'; parInput.inputMode = 'numeric'; parInput.value = state.holes[i].par;
      parInput.onchange = (e)=>{ state.holes[i].par = parseInt(e.target.value)||4; };
      tdPar.appendChild(parInput);
      const tdSi = document.createElement('td');
      const siInput = document.createElement('input');
      siInput.type = 'number'; siInput.inputMode = 'numeric'; siInput.value = state.holes[i].si;
      siInput.onchange = (e)=>{ state.holes[i].si = parseInt(e.target.value)||1; };
      tdSi.appendChild(siInput);
      tr.appendChild(tdPar); tr.appendChild(tdSi);
      table.appendChild(tr);
    }
    wrap.appendChild(table);

    return wrap;
  }

  function renderPlay(){
    const wrap = document.createElement('div');
    if (state.players.length === 0){
      wrap.innerHTML = `<div class="empty">Add at least one player in the "Players" tab to start.</div>`;
      return wrap;
    }

    const hole = state.holes[state.currentHole];
    const nav = document.createElement('div');
    nav.className = 'hole-nav';
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.disabled = state.currentHole === 0;
    prevBtn.onclick = ()=>{ generateAutoNotifications(state.currentHole); state.currentHole--; render(); };
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.disabled = state.currentHole === state.numHoles - 1;
    nextBtn.onclick = ()=>{ generateAutoNotifications(state.currentHole); state.currentHole++; render(); };
    const big = document.createElement('div');
    big.className = 'hole-big';
    big.innerHTML = `
      <div class="col">
        <div class="label">Hole</div>
        <div class="value">${state.currentHole+1}</div>
      </div>
      <div class="col">
        <div class="label name-label">${hole.name ? escapeHtml(hole.name) : '\u00A0'}</div>
        <div class="value">Par ${hole.par} · SI ${hole.si}</div>
      </div>
    `;
    nav.appendChild(prevBtn); nav.appendChild(big); nav.appendChild(nextBtn);
    wrap.appendChild(nav);

    const dots = document.createElement('div');
    dots.className = 'hole-dots';
    for (let i=0;i<state.numHoles;i++){
      const dot = document.createElement('span');
      const anyScore = state.players.some(p=>p.scores[i]!==undefined);
      if (i === state.currentHole) dot.className = 'current';
      else if (anyScore) dot.className = 'done';
      dots.appendChild(dot);
    }
    wrap.appendChild(dots);

    const mpTeamForPlay = computeLiveMatchplay('teams');
    const mpPlayerForPlay = computeLiveMatchplay('players');
    const mpEngineFor = (p)=>{
      if (mpTeamForPlay && mpTeamForPlay.sideOf(p) !== -1) return mpTeamForPlay;
      if (mpPlayerForPlay && mpPlayerForPlay.sideOf(p) !== -1) return mpPlayerForPlay;
      return null;
    };
    const { list: orderedPlayers } = getGroupedPlayers();

    // On the very last hole, there's no "next hole" screen to reveal the
    // final match result on the way to — so once everyone's score for that
    // hole is in, give it a short pause (in case someone needs to correct an
    // entry) then update this same screen to show the final Won/Lost/Dormy
    // result, following the exact same rules as everywhere else.
    const isLastHole = state.currentHole === state.numHoles - 1;
    const lastHoleFullyPlayed = orderedPlayers.some(p=>{
      const eng = mpEngineFor(p);
      return eng && eng.thru === state.numHoles;
    });
    const REVEAL_PAUSE_MS = 3000;
    let showFinalResult = false;
    if (isLastHole && lastHoleFullyPlayed){
      if (state._lastHoleRevealAt === null){
        state._lastHoleRevealAt = Date.now() + REVEAL_PAUSE_MS;
        setTimeout(render, REVEAL_PAUSE_MS);
      }
      showFinalResult = Date.now() >= state._lastHoleRevealAt;
    } else {
      state._lastHoleRevealAt = null;
    }

    let scoreIdx = 0;
    while (scoreIdx < orderedPlayers.length){
      const groupPlayer = orderedPlayers[scoreIdx];
      const groupTeamId = (groupPlayer.teamId && state.teams.some(t=>t.id === groupPlayer.teamId)) ? groupPlayer.teamId : null;
      let scoreJ = scoreIdx;
      while (scoreJ < orderedPlayers.length && ((orderedPlayers[scoreJ].teamId && state.teams.some(t=>t.id===orderedPlayers[scoreJ].teamId)) ? orderedPlayers[scoreJ].teamId : null) === groupTeamId){
        scoreJ++;
      }
      const scoreGroup = orderedPlayers.slice(scoreIdx, scoreJ);
      const scoreTeam = groupTeamId ? state.teams.find(t=>t.id === groupTeamId) : null;

      let scoreTarget = wrap;
      if (scoreTeam){
        scoreTarget = document.createElement('div');
        scoreTarget.className = 'team-group-wrap team-group-wrap-labeled';
        scoreTarget.style.border = `20px solid ${scoreTeam.color}`;
        const teamLabel = document.createElement('div');
        teamLabel.className = 'team-group-label';
        teamLabel.textContent = scoreTeam.name;
        scoreTarget.appendChild(teamLabel);
        wrap.appendChild(scoreTarget);
      }

      scoreGroup.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'score-entry';
      const gross = p.scores[state.currentHole];
      const strokes = strokesReceived(p.hcp, hole.si, state.numHoles);
      let netLine = '';
      if (gross !== undefined){
        const net = gross - strokes;
        const pts = pointsForNet(net, hole.par);
        netLine = `<div class="net-line">Net ${net} · <span class="pts">${pts} pt${pts===1?'':'s'}</span></div>`;
      }
      if (!p.flags) p.flags = {};
      if (!p.flags[state.currentHole]) p.flags[state.currentHole] = { penalty:0, lostBall:0, oob:0, kieroning:0 };
      const flags = p.flags[state.currentHole];

      const strokesHtml = strokes > 0
        ? `<span class="strokes-circle">+${strokes}</span><span class="strokes-word">stroke${strokes===1?'':'s'}</span>`
        : `<span class="strokes-circle strokes-circle-zero">0</span><span class="strokes-word">strokes</span>`;

      // Match status through the previous hole — only from hole 2 onward,
      // once there's an actual result to show, and tucked under the strokes
      // line rather than adding a new row, so the card doesn't get taller.
      // On the last hole, once everyone's score is in and the short pause
      // has elapsed, this switches to the final result for that hole itself
      // instead (there's no "next hole" screen to reveal it on otherwise).
      let mpBadgeHtml = '';
      const mpForPlay = mpEngineFor(p);
      if (mpForPlay && showFinalResult){
        const side = mpForPlay.sideOf(p);
        if (side !== -1){
          const status = mpForPlay.statusAt(state.currentHole, side, 'rich', true);
          mpBadgeHtml = `<div class="mp-play-badge ${status.cls}">${status.text}</div>`;
        }
      } else if (mpForPlay && state.currentHole > 0){
        const side = mpForPlay.sideOf(p);
        const prevHoleIdx = state.currentHole - 1;
        if (side !== -1 && mpForPlay.thru > prevHoleIdx){
          const status = mpForPlay.statusAt(prevHoleIdx, side, 'rich', true);
          mpBadgeHtml = `<div class="mp-play-badge ${status.cls}">${status.text}</div>`;
        }
      }

      card.innerHTML = `
        <div class="score-row">
          <div class="score-left">
            <div class="pname"><span class="pname-text">${escapeHtml(p.name)}</span></div>
            <div class="strokes-given">${strokesHtml}</div>
            ${mpBadgeHtml}
          </div>
          <div class="score-mid">
            <div class="stepper">
              <button data-act="minus">−</button>
              <span class="sb-scale-play">${buildScoreBadgeHTML(gross, hole.par)}</span>
              <button data-act="plus">+</button>
            </div>
            ${netLine ? `<div class="score-meta">${netLine}</div>` : ''}
          </div>
          <div class="score-flags">
            <div class="flag-box" data-flag="penalty">Penalty${flagSquareHtml(flags.penalty)}</div>
            <div class="flag-box" data-flag="lostBall">Lost Ball${flagSquareHtml(flags.lostBall)}</div>
            <div class="flag-box" data-flag="oob">OOB${flagSquareHtml(flags.oob)}</div>
            <div class="flag-box" data-flag="kieroning">Kieroning (cheat)${flagSquareHtml(flags.kieroning)}</div>
          </div>
        </div>
      `;
      const minusBtn = card.querySelector('[data-act="minus"]');
      const plusBtn = card.querySelector('[data-act="plus"]');
      minusBtn.onclick = ()=>{
        const cur = p.scores[state.currentHole] ?? hole.par + 1;
        p.scores[state.currentHole] = Math.max(1, cur - 1);
        render();
      };
      plusBtn.onclick = ()=>{
        const cur = p.scores[state.currentHole] ?? hole.par - 1;
        p.scores[state.currentHole] = cur + 1;
        render();
      };
      // Tap a flag box to tick it (1), tap again for 2, 3, and so on. Hold it
      // down for ~800ms to reset back to blank.
      card.querySelectorAll('.flag-box').forEach(box=>{
        const key = box.dataset.flag;
        let holdTimer = null;
        let longPressFired = false;
        const startHold = ()=>{
          longPressFired = false;
          holdTimer = setTimeout(()=>{
            // Only mutate the data here — NOT render() — since re-rendering
            // mid-gesture would tear down this element while the finger/mouse
            // is still down, and the eventual release would then land on a
            // brand new element and register as a spurious extra tap.
            longPressFired = true;
            flags[key] = 0;
          }, 800);
        };
        const endHold = ()=>{
          clearTimeout(holdTimer);
          if (!longPressFired){
            flags[key] = (flags[key] || 0) + 1;
          }
          render();
        };
        const cancelHold = ()=>{
          clearTimeout(holdTimer);
          if (longPressFired) render();
        };
        box.addEventListener('pointerdown', startHold);
        box.addEventListener('pointerup', endHold);
        box.addEventListener('pointerleave', cancelHold);
        box.addEventListener('pointercancel', cancelHold);
      });
      scoreTarget.appendChild(card);
      });

      scoreIdx = scoreJ;
    }

    if (state.currentHole === state.numHoles - 1){
      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn btn-flag';
      finishBtn.textContent = 'View Scorecard →';
      finishBtn.onclick = ()=>{ state.tab = 'scorecard'; render(); };
      wrap.appendChild(finishBtn);
    }

    return wrap;
  }

  function buildScorecardSection(completedRound){
    // completedRound === null means "the current, live, editable round".
    // Otherwise it's an entry from state.completedRounds, rendered read-only.
    const section = document.createElement('div');
    const isLive = completedRound === null;
    const holesData = isLive ? state.holes : completedRound.holes;
    const numHolesVal = isLive ? state.numHoles : completedRound.numHoles;
    const courseNameVal = isLive ? state.courseName : completedRound.courseName;

    const courseTitle = document.createElement('div');
    courseTitle.style.marginBottom = '2px';
    courseTitle.innerHTML = `<span style="font-weight:700;font-size:13.5px;">${escapeHtml(courseNameVal)}</span>`;
    if (isLive){
      courseTitle.innerHTML += ` <span style="font-style:italic;font-size:12px;color:var(--ink-soft);">Tap score to edit</span>`;
    }
    section.appendChild(courseTitle);

    if (!isLive){
      const dateStr = new Date(completedRound.date).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
      const dateHint = document.createElement('div');
      dateHint.className = 'hint';
      dateHint.style.marginBottom = '10px';
      dateHint.textContent = `Finished ${dateStr} · ${numHolesVal} holes`;
      section.appendChild(dateHint);
    }

    // Front 9 / Back 9 toggle — keeps the table narrow enough to fit the screen.
    // Shared across every round section so they all stay in sync.
    const showsHalves = numHolesVal > 9;
    let startIdx = 0, endIdx = numHolesVal - 1;
    if (showsHalves){
      const toggle = document.createElement('div');
      toggle.style.display = 'flex';
      toggle.style.gap = '6px';
      toggle.style.marginBottom = '4px';
      [['front','Front 9', 0, 8], ['back','Back 9', 9, numHolesVal-1]].forEach(([key,label])=>{
        const b = document.createElement('button');
        b.textContent = label;
        b.style.flex = '1';
        b.style.padding = '8px 4px';
        b.style.borderRadius = '7px';
        b.style.fontSize = '13px';
        b.style.fontWeight = '600';
        b.style.cursor = 'pointer';
        const active = state.scorecardHalf === key;
        b.style.border = active ? 'none' : '1.5px solid var(--line)';
        b.style.background = active ? 'var(--fairway)' : '#fff';
        b.style.color = active ? 'var(--cream)' : 'var(--ink-soft)';
        b.onclick = ()=>{ state.scorecardHalf = key; render(); };
        toggle.appendChild(b);
      });
      section.appendChild(toggle);
      if (state.scorecardHalf === 'back'){ startIdx = 9; endIdx = numHolesVal - 1; }
      else { startIdx = 0; endIdx = Math.min(8, numHolesVal - 1); }
    }

    const scrollBox = document.createElement('div');
    scrollBox.className = 'scorecard-scroll';

    const table = document.createElement('table');
    table.className = 'card compact';
    table.style.marginTop = '2px';
    table.style.borderCollapse = 'separate';
    table.style.borderSpacing = '0';

    // Helper: sum a player's gross + Stableford points over an inclusive hole-index range,
    // only counting holes that actually have a score entered.
    function holeRangeStats(p, from, to){
      let gross = 0, pts = 0, played = false;
      for (let i = from; i <= to; i++){
        const g = p.scores ? p.scores[i] : undefined;
        if (g === undefined || g === null) continue;
        played = true;
        gross += g;
        const strokes = strokesReceived(p.hcp, holesData[i].si, numHolesVal);
        const net = g - strokes;
        pts += pointsForNet(net, holesData[i].par);
      }
      return { gross: played ? gross : 0, pts, played };
    }
    function sumPar(from, to){
      let s = 0;
      for (let i = from; i <= to; i++) s += holesData[i].par;
      return s;
    }
    const backStart = 9, backEnd = numHolesVal - 1;
    const isFrontView = state.scorecardHalf !== 'back';

    // Header row
    const thead = document.createElement('tr');
    let headHtml = '<th></th><th style="font-weight:800;">Holes</th>';
    for (let i=startIdx;i<=endIdx;i++) headHtml += `<th style="font-weight:800;">${i+1}</th>`;
    if (showsHalves){
      headHtml += isFrontView ? '<th>Out</th>' : '<th>In</th><th>Tot</th>';
    } else {
      headHtml += '<th>Gross</th><th>Pts</th>';
    }
    thead.innerHTML = headHtml;
    table.appendChild(thead);

    // Par row
    const parTr = document.createElement('tr');
    let parHtml = '<td></td><td style="font-weight:700;color:var(--ink-soft);">Par</td>';
    for (let i=startIdx;i<=endIdx;i++){ parHtml += `<td>${holesData[i].par}</td>`; }
    const frontPar = sumPar(0, 8);
    if (showsHalves){
      if (isFrontView){
        parHtml += `<td style="font-weight:700;">${frontPar}</td>`;
      } else {
        const backPar = sumPar(backStart, backEnd);
        parHtml += `<td style="font-weight:700;">${backPar}</td><td style="font-weight:700;">${frontPar+backPar}</td>`;
      }
    } else {
      parHtml += `<td style="font-weight:700;">${frontPar}</td><td>–</td>`;
    }
    parTr.innerHTML = parHtml;
    table.appendChild(parTr);
    scrollBox.appendChild(table);

    // Player rows — either the live, editable players or a completed round's saved entries
    let rowsData = isLive ? state.players : completedRound.entries;

    // Group players by team (alphabetically, with a small gap between
    // teams) when teams are in use. Historical rounds don't carry team
    // info, so this only applies to the live round.
    let teamBreakAfter = new Set();
    if (isLive){
      const g = getGroupedPlayers();
      rowsData = g.list;
      teamBreakAfter = g.teamBreaks;
    }

    // Team and player games are fully independent now — either can be
    // Matchplay, Skins, or Stableford (no overlay), at the same time. For
    // any given player, a TEAM-level overlay (if they're on a team running
    // Matchplay/Skins) takes priority over a PLAYER-level one, matching the
    // "team game on top" ordering used on the Leaderboard. A completed round
    // can only fall back to the simple 2-player Matchplay case at the player
    // level, since saved entries don't carry team membership.
    let teamOverlay = null;
    let playerOverlay = null;

    if (isLive){
      if (state.teamGameType === 'Matchplay'){
        const mp = computeLiveMatchplay('teams');
        if (mp) teamOverlay = { kind: 'matchplay', engine: mp };
      } else if (state.teamGameType === 'Skins'){
        const sk = computeLiveSkins('teams');
        if (sk) teamOverlay = { kind: 'skins', engine: sk };
      } else if (state.teamGameType === 'Split Sixes'){
        const ss = computeLiveSplitSixes('teams');
        if (ss) teamOverlay = { kind: 'splitsixes', engine: ss };
      }
      if (state.playersGameType === 'Matchplay'){
        const mp = computeLiveMatchplay('players');
        if (mp) playerOverlay = { kind: 'matchplay', engine: mp };
      } else if (state.playersGameType === 'Skins'){
        const sk = computeLiveSkins('players');
        if (sk) playerOverlay = { kind: 'skins', engine: sk };
      } else if (state.playersGameType === 'Split Sixes'){
        const ss = computeLiveSplitSixes('players');
        if (ss) playerOverlay = { kind: 'splitsixes', engine: ss };
      }
    } else if (state.playersGameType === 'Matchplay' && rowsData.length === 2){
      const sides = [[rowsData[0]], [rowsData[1]]];
      const sideMap = new Map();
      sides.forEach((members, sideIdx)=> members.forEach(p=> sideMap.set(p, sideIdx)));

      const sidePointsPerHole = sides.map(members=>{
        const perHole = [], played = [];
        for (let i=0;i<numHolesVal;i++){
          let sum = 0, any = false;
          members.forEach(p=>{
            const g = p.scores ? p.scores[i] : undefined;
            if (g === undefined || g === null) return;
            any = true;
            const strokes = strokesReceived(p.hcp, holesData[i].si, numHolesVal);
            sum += pointsForNet(g - strokes, holesData[i].par);
          });
          perHole.push(sum);
          played.push(any);
        }
        return { perHole, played };
      });

      let tally = 0;
      const tallyPerHole = [];
      let decidedAtHole = -1, decidedTally = 0, decidedHolesLeft = 0;
      for (let i=0;i<numHolesVal;i++){
        if (sidePointsPerHole[0].played[i] && sidePointsPerHole[1].played[i]){
          if (sidePointsPerHole[0].perHole[i] > sidePointsPerHole[1].perHole[i]) tally++;
          else if (sidePointsPerHole[1].perHole[i] > sidePointsPerHole[0].perHole[i]) tally--;
          if (decidedAtHole === -1){
            const holesLeft = numHolesVal - (i + 1);
            if (Math.abs(tally) > holesLeft){
              decidedAtHole = i;
              decidedTally = tally;
              decidedHolesLeft = holesLeft;
            }
          }
        }
        tallyPerHole.push(tally);
      }
      const statusAtCompleted = (holeIdx, side)=>{
        if (decidedAtHole !== -1 && holeIdx > decidedAtHole) return { blank: true };
        if (decidedAtHole !== -1 && holeIdx === decidedAtHole) return matchStatusText(decidedTally, decidedHolesLeft, side, 'compact');
        return matchStatusText(tallyPerHole[holeIdx], numHolesVal - (holeIdx + 1), side, 'compact');
      };
      const statusPerHole = [
        tallyPerHole.map((t,i)=> statusAtCompleted(i, 0)),
        tallyPerHole.map((t,i)=> statusAtCompleted(i, 1)),
      ];
      playerOverlay = { kind: 'matchplay', engine: { sideOf: (p)=> sideMap.has(p) ? sideMap.get(p) : -1, statusAt: (i, side)=> statusPerHole[side][i] } };
    }

    // Resolve which overlay (if any) applies to a given player, and what to
    // show for a specific hole — {text, cls} for matchplay, or a plain
    // running total for skins/split sixes.
    function overlayFor(p){
      if (teamOverlay){
        if (teamOverlay.kind === 'matchplay'){
          const side = teamOverlay.engine.sideOf(p);
          if (side !== -1) return { kind: 'matchplay', engine: teamOverlay.engine, idx: side };
        } else {
          const idx = teamOverlay.engine.entryIndexForPlayer(p);
          if (idx !== -1) return { kind: teamOverlay.kind, engine: teamOverlay.engine, idx };
        }
      }
      if (playerOverlay){
        if (playerOverlay.kind === 'matchplay'){
          const side = playerOverlay.engine.sideOf(p);
          if (side !== -1) return { kind: 'matchplay', engine: playerOverlay.engine, idx: side };
        } else {
          const idx = playerOverlay.engine.entryIndexForPlayer(p);
          if (idx !== -1) return { kind: playerOverlay.kind, engine: playerOverlay.engine, idx };
        }
      }
      return null;
    }

    // Precompute which rows belong to a multi-member team group, and which
    // is the first/last row of that group — used below to draw a coloured
    // box around the group (same idea as Scores/Players) and to place the
    // team name inside the top-left corner.
    const rowGroupInfo = new Array(rowsData.length).fill(null);
    {
      let gi = 0;
      while (gi < rowsData.length){
        const pTeamId = (rowsData[gi].teamId && state.teams.some(t=>t.id===rowsData[gi].teamId)) ? rowsData[gi].teamId : null;
        let gj = gi;
        while (gj < rowsData.length && ((rowsData[gj].teamId && state.teams.some(t=>t.id===rowsData[gj].teamId)) ? rowsData[gj].teamId : null) === pTeamId) gj++;
        if (pTeamId && (gj - gi) >= 1){
          const team = state.teams.find(t=>t.id === pTeamId);
          for (let k=gi;k<gj;k++) rowGroupInfo[k] = { team, isFirst: k===gi, isLast: k===gj-1 };
        }
        gi = gj;
      }
    }

    // Each team gets its own separate small <table>, wrapped in a plain div
    // with a genuine CSS border — the same technique proven to work on
    // Scores/Players. Internal table elements like <tbody> don't reliably
    // paint borders in any browser (getComputedStyle reports the value, but
    // it's never actually drawn — a real, if obscure, CSS table-model
    // limitation), and a single table with per-cell borders trying to line
    // up into one seamless outline was never going to be pixel-perfect
    // either. Ungrouped players share one borderless table, same as before.
    function newChunkTable(){
      const t = document.createElement('table');
      t.className = 'card compact';
      t.style.marginTop = '0';
      t.style.marginBottom = '10px';
      t.style.borderCollapse = 'separate';
      t.style.borderSpacing = '0';
      return t;
    }
    let chunkTable = newChunkTable();
    let currentAppendTarget = chunkTable;
    let chunkTableAttached = false; // true once chunkTable is already somewhere in the DOM (e.g. inside a team wrapper) — flushChunk must not re-append it then, or it gets *moved* out of the wrapper instead of staying put
    function flushChunk(){
      if (!chunkTableAttached && chunkTable.children.length) scrollBox.appendChild(chunkTable);
      chunkTable = newChunkTable();
      currentAppendTarget = chunkTable;
      chunkTableAttached = false;
    }

    rowsData.forEach((p, rowIdx)=>{
      const tr = document.createElement('tr');
      const groupInfo = rowGroupInfo[rowIdx];

      // A new team starting means whatever was accumulating before (an
      // ungrouped run, or nothing) is done — flush it, then start this
      // team's own table wrapped in a coloured border div.
      if (groupInfo && groupInfo.isFirst){
        flushChunk();
        chunkTable.style.marginBottom = '0'; // wrapper below carries the spacing instead
        const groupWrapDiv = document.createElement('div');
        groupWrapDiv.style.border = `20px solid ${groupInfo.team.color}`;
        groupWrapDiv.style.borderRadius = '16px';
        groupWrapDiv.style.marginBottom = '10px';
        groupWrapDiv.style.position = 'relative';
        groupWrapDiv.appendChild(chunkTable);
        // Team name embedded directly in the border stroke, same technique
        // (and same look) as the Scores tab's version.
        const label = document.createElement('div');
        label.className = 'team-group-label';
        label.textContent = groupInfo.team.name;
        groupWrapDiv.appendChild(label);
        scrollBox.appendChild(groupWrapDiv);
        chunkTableAttached = true;
      }

      // Small vertical "Score" label, spans just this row. No bottom border
      // here — its own border-bottom otherwise bleeds across the row
      // boundary right through the name cell next to it.
      const scoreLabelTd = document.createElement('td');
      scoreLabelTd.className = 'row-label-cell';
      scoreLabelTd.style.borderBottom = 'none';
      scoreLabelTd.innerHTML = `<span class="row-label-vertical">Score</span>`;
      tr.appendChild(scoreLabelTd);

      // Player name spans both of this player's rows, centered.
      const nameTd = document.createElement('td');
      nameTd.rowSpan = 2;
      nameTd.className = 'player-name-cell';
      nameTd.innerHTML = `<span>${escapeHtml(p.name)}</span>`;
      tr.appendChild(nameTd);

      for (let i=startIdx;i<=endIdx;i++){
        const td = document.createElement('td');
        const hole = holesData[i];
        const g = p.scores[i];
        td.innerHTML = `<span class="sb-scale-wrap">${buildScoreBadgeHTML(g, hole.par, isLive)}</span>`;
        if (isLive){
          const input = td.querySelector('input');
          input.onchange = (e)=>{
            const v = parseInt(e.target.value);
            if (isNaN(v) || v <= 0) delete p.scores[i];
            else p.scores[i] = v;
            render();
          };
        }
        tr.appendChild(td);
      }

      const front = holeRangeStats(p, 0, 8);
      const back = showsHalves ? holeRangeStats(p, backStart, backEnd) : { gross:0, pts:0 };
      if (showsHalves){
        if (isFrontView){
          const grossTd = document.createElement('td');
          grossTd.style.fontWeight = '700';
          grossTd.textContent = front.gross || '–';
          tr.appendChild(grossTd);
        } else {
          const inTd = document.createElement('td');
          inTd.style.fontWeight = '700';
          inTd.textContent = back.gross || '–';
          tr.appendChild(inTd);
          const totTd = document.createElement('td');
          totTd.style.fontWeight = '700';
          const totalGross = front.gross + back.gross;
          totTd.textContent = totalGross || '–';
          tr.appendChild(totTd);
        }
      } else {
        let pts, gross;
        if (isLive){ ({pts, gross} = playerTotals(p)); }
        else { pts = p.pts; gross = p.gross; }
        const grossTd = document.createElement('td');
        grossTd.style.fontWeight = '700';
        grossTd.textContent = gross || '–';
        tr.appendChild(grossTd);
        const ptsTd = document.createElement('td');
        ptsTd.style.fontWeight = '700';
        ptsTd.style.color = 'var(--fairway)';
        ptsTd.textContent = pts;
        tr.appendChild(ptsTd);
      }

      currentAppendTarget.appendChild(tr);

      // Second row per player: Stableford points for each hole, same size as
      // the gross row above but with no colour coding — a plain number badge,
      // smaller and lighter than the score row so it reads as a sub-line.
      const ptsTr = document.createElement('tr');
      ptsTr.className = 'pts-subrow';
      const ptsLabelTd = document.createElement('td');
      ptsLabelTd.className = 'row-label-cell';
      ptsLabelTd.innerHTML = `<span class="row-label-vertical">Points</span>`;
      ptsTr.appendChild(ptsLabelTd);
      // (name cell is skipped here — it's already spanning down from the row above)
      for (let i=startIdx;i<=endIdx;i++){
        const td = document.createElement('td');
        const hole = holesData[i];
        const g = p.scores[i];
        if (g !== undefined && g !== null){
          const strokes = strokesReceived(p.hcp, hole.si, numHolesVal);
          const net = g - strokes;
          const holePts = pointsForNet(net, hole.par);
          const ov = overlayFor(p);
          if (ov && ov.kind === 'matchplay' && !ov.engine.statusAt(i, ov.idx, 'compact', false).blank){
            const mpStat = ov.engine.statusAt(i, ov.idx, 'compact', false);
            td.innerHTML = `<span class="sb-scale-wrap"><div class="score-badge sb-box sb-plain mp-cell">
              <span class="mp-diag mp-diag-${mpStat.cls}"></span>
              <span class="mp-stableford">${holePts}</span>
              <span class="mp-status mp-status-${mpStat.cls}">${mpStat.text}</span>
            </div></span>`;
          } else if (ov && (ov.kind === 'skins' || ov.kind === 'splitsixes') && i < ov.engine.thru){
            const cumTotal = ov.engine.cumulativeAt(ov.idx, i);
            td.innerHTML = `<span class="sb-scale-wrap"><div class="score-badge sb-box sb-plain mp-cell">
              <span class="mp-diag mp-diag-${ov.kind}"></span>
              <span class="mp-stableford">${holePts}</span>
              <span class="mp-status mp-status-${ov.kind}">${cumTotal}</span>
            </div></span>`;
          } else {
            td.innerHTML = `<span class="sb-scale-wrap"><div class="score-badge sb-box sb-plain"><span class="sb-num">${holePts}</span></div></span>`;
          }
        } else {
          td.innerHTML = `<span class="sb-scale-wrap"><div class="score-badge sb-empty">–</div></span>`;
        }
        ptsTr.appendChild(td);
      }
      if (showsHalves){
        if (isFrontView){
          const outPtsTd = document.createElement('td');
          outPtsTd.style.fontWeight = '700';
          outPtsTd.style.color = 'var(--fairway)';
          outPtsTd.textContent = front.pts;
          ptsTr.appendChild(outPtsTd);
        } else {
          const inPtsTd = document.createElement('td');
          inPtsTd.style.fontWeight = '700';
          inPtsTd.style.color = 'var(--fairway)';
          inPtsTd.textContent = back.pts;
          ptsTr.appendChild(inPtsTd);
          const totPtsTd = document.createElement('td');
          totPtsTd.style.fontWeight = '700';
          totPtsTd.style.color = 'var(--fairway)';
          totPtsTd.textContent = front.pts + back.pts;
          ptsTr.appendChild(totPtsTd);
        }
      } else {
        ptsTr.appendChild(document.createElement('td'));
        ptsTr.appendChild(document.createElement('td'));
      }
      currentAppendTarget.appendChild(ptsTr);

      if ((groupInfo && groupInfo.isLast) || teamBreakAfter.has(rowIdx)){
        flushChunk();
      }
    });

    flushChunk();
    section.appendChild(scrollBox);

    // Score color legend — colours generated live from getBadgeMeta() so this
    // always matches whichever palette (normal or colour-blind-safe) the
    // actual score badges above are using.
    const legend = document.createElement('div');
    legend.style.display = 'flex';
    legend.style.flexWrap = 'wrap';
    legend.style.gap = '10px';
    legend.style.marginTop = '14px';
    legend.style.fontSize = '11px';
    legend.style.color = 'var(--ink-soft)';
    const bm = getBadgeMeta();
    const legendDot = (cat, round)=> `<span class="legend-dot" style="background:${bm[cat].bg};${round?'border-radius:50%;':''}"></span>`;
    legend.innerHTML = `
      <span>${legendDot('albatross')} Albatross+</span>
      <span>${legendDot('eagle')} Eagle</span>
      <span>${legendDot('birdie', true)} Birdie</span>
      <span><span class="legend-dot sc-par"></span> Par</span>
      <span>${legendDot('bogey')} Bogey</span>
      <span>${legendDot('double')} Double</span>
      <span>${legendDot('triple')} Triple+</span>
    `;
    section.appendChild(legend);

    if (isLive){
      const anyScoresYet = state.players.some(p => Object.keys(p.scores).length > 0);
      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn btn-flag';
      finishBtn.style.marginTop = '22px';
      if (!anyScoresYet){
        finishBtn.style.opacity = '0.5';
        finishBtn.style.cursor = 'not-allowed';
      }
      finishBtn.textContent = 'Finish Round & Add to Leaderboard';
      finishBtn.onclick = ()=>{
        const anyScores = state.players.some(p => Object.keys(p.scores).length > 0);
        if (!anyScores) return;
        const entries = state.players.map(p=>{
          const {pts, gross} = playerTotals(p);
          return { name: p.name, color: p.color, hcp: p.hcp, pts, gross, scores: {...p.scores} };
        });
        state.completedRounds.push({
          id: uid(),
          courseName: state.courseName,
          numHoles: state.numHoles,
          holes: state.holes.map(h=>({...h})),
          date: new Date().toISOString(),
          entries
        });
        state.players.forEach(p=>p.scores={});
        state.currentHole = 0;
        state.tab = 'leaderboard';
        render();
      };
      section.appendChild(finishBtn);
    }

    return section;
  }

  function renderScorecard(){
    const wrap = document.createElement('div');
    if (state.players.length === 0){
      wrap.innerHTML = `<div class="empty">No players yet. Add players in the Players tab.</div>`;
      return wrap;
    }

    const numRounds = state.numRounds || 1;

    if (numRounds <= 1){
      wrap.appendChild(buildScorecardSection(null));
      return wrap;
    }

    // Multiple rounds in this competition. The current, live round goes at
    // the top (that's the one people are actually looking at), then finished
    // rounds below it in the order they were played, then any not-yet-started
    // rounds at the very end.
    const liveRoundNum = state.completedRounds.length + 1; // which round number is still in progress (if any)
    const order = [];
    if (liveRoundNum <= numRounds) order.push(liveRoundNum);
    for (let r = 1; r < Math.min(liveRoundNum, numRounds + 1); r++) order.push(r); // completed rounds, chronological
    for (let r = liveRoundNum + 1; r <= numRounds; r++) order.push(r); // not started yet

    order.forEach((r, idx)=>{
      const heading = document.createElement('div');
      heading.className = 'section-title';
      heading.style.marginTop = idx === 0 ? '0' : '28px';
      heading.textContent = r === liveRoundNum ? `Round ${r} (Current)` : `Round ${r}`;
      wrap.appendChild(heading);

      if (r <= state.completedRounds.length){
        wrap.appendChild(buildScorecardSection(state.completedRounds[r-1]));
      } else if (r === liveRoundNum){
        wrap.appendChild(buildScorecardSection(null));
      } else {
        const notStarted = document.createElement('div');
        notStarted.className = 'hint';
        notStarted.style.margin = '0';
        notStarted.textContent = 'Not started yet — finish the round(s) above first.';
        wrap.appendChild(notStarted);
      }
    });

    wrap.appendChild(buildGrandTotalSection());

    return wrap;
  }

  function buildGrandTotalSection(){
    const section = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'section-title';
    title.style.marginTop = '28px';
    title.textContent = 'Grand Total';
    section.appendChild(title);

    // Sum gross shots and points across every finished round plus the live round in progress
    const totals = {};
    state.completedRounds.forEach(round=>{
      round.entries.forEach(e=>{
        if (!totals[e.name]) totals[e.name] = { name: e.name, color: e.color, gross: 0, pts: 0 };
        totals[e.name].gross += e.gross;
        totals[e.name].pts += e.pts;
      });
    });
    state.players.forEach(p=>{
      const { pts, gross } = playerTotals(p);
      if (!totals[p.name]) totals[p.name] = { name: p.name, color: p.color, gross: 0, pts: 0 };
      totals[p.name].color = p.color;
      totals[p.name].gross += gross;
      totals[p.name].pts += pts;
    });

    const ranked = Object.values(totals).sort((a,b)=> b.pts - a.pts);
    if (ranked.length === 0){
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.style.margin = '0';
      hint.textContent = 'Totals across all rounds will show up here once scores are entered.';
      section.appendChild(hint);
      return section;
    }

    const table = document.createElement('table');
    table.className = 'card compact';
    let headHtml = '<tr><th style="text-align:left;">Player</th><th>Gross</th><th>Pts</th></tr>';
    table.innerHTML = headHtml;
    ranked.forEach(t=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align:left;display:flex;align-items:center;gap:5px;"><span class="pdot" style="background:${t.color}"></span>${escapeHtml(t.name)}</td>
        <td style="font-weight:700;">${t.gross}</td>
        <td style="font-weight:700;color:var(--fairway);">${t.pts}</td>
      `;
      table.appendChild(tr);
    });
    section.appendChild(table);
    return section;
  }

  function renderLeaderboard(){
    const wrap = document.createElement('div');

    // Historical totals from finished rounds
    const totals = {};
    state.completedRounds.forEach(round=>{
      round.entries.forEach(e=>{
        if (!totals[e.name]) totals[e.name] = { name: e.name, color: e.color, pts: 0, gross: 0, roundsFinished: 0, liveThru: 0 };
        totals[e.name].pts += e.pts;
        totals[e.name].gross += e.gross;
        totals[e.name].roundsFinished += 1;
      });
    });

    // Add the live, in-progress round on top so the board updates as scores are entered
    let liveInProgress = false;
    state.players.forEach(p=>{
      const {pts, gross, thru} = playerTotals(p);
      if (thru > 0) liveInProgress = true;
      if (!totals[p.name]) totals[p.name] = { name: p.name, color: p.color, pts: 0, gross: 0, roundsFinished: 0, liveThru: 0 };
      totals[p.name].color = p.color; // reflect current session color
      totals[p.name].pts += pts;
      totals[p.name].gross += gross;
      totals[p.name].liveThru = thru;
    });

    const ranked = Object.values(totals).sort((a,b)=> b.pts - a.pts);

    // Reusable builders for a Matchplay summary card or a Skins leaderboard,
    // used for both the team-level and player-level sections below.
    function buildMatchplaySummaryCard(mpBoard, sectionLabel, isFirst){
      const mpTitle = document.createElement('div');
      mpTitle.className = 'section-title';
      if (isFirst) mpTitle.style.marginTop = '0';
      mpTitle.textContent = sectionLabel;
      wrap.appendChild(mpTitle);

      const mpCard = document.createElement('div');
      mpCard.className = 'history-callout';
      mpCard.style.display = 'flex';
      mpCard.style.alignItems = 'center';
      mpCard.style.justifyContent = 'center';
      mpCard.style.padding = '18px 14px';
      mpCard.style.flexDirection = 'row';
      mpCard.style.gap = '12px';

      let statusText, statusClass, thruText = '';
      if (mpBoard.thru === 0){
        statusText = 'Match not yet underway';
        statusClass = 'mp-play-as';
      } else {
        const leadHoleIdx = mpBoard.thru - 1;
        const tally = mpBoard.tallyPerHole[leadHoleIdx];
        thruText = `Thru ${mpBoard.thru} hole${mpBoard.thru === 1 ? '' : 's'}`;
        if (tally === 0){
          statusText = 'All square';
          statusClass = 'mp-play-as';
        } else {
          const leaderSide = tally > 0 ? 0 : 1;
          const leader = mpBoard.sides[leaderSide];
          const status = mpBoard.statusAt(leadHoleIdx, leaderSide, 'rich', true);
          statusText = status.text === 'AS' ? 'All square' : `${escapeHtml(leader.label)} ${status.text}`;
          statusClass = status.cls;
        }
      }

      mpCard.innerHTML = `
        <div class="mp-play-badge ${statusClass} mp-leaderboard-summary">${statusText}</div>
        ${thruText ? `<div class="mp-thru-label">${thruText}</div>` : ''}
      `;
      wrap.appendChild(mpCard);
    }

    function buildPointsLeaderboard(board, sectionLabel, isFirst){
      const skTitle = document.createElement('div');
      skTitle.className = 'section-title';
      if (isFirst) skTitle.style.marginTop = '0';
      skTitle.textContent = sectionLabel;
      wrap.appendChild(skTitle);

      const skHint = document.createElement('div');
      skHint.className = 'hint';
      skHint.style.marginTop = '-6px';
      skHint.textContent = board.thru === 0
        ? 'No holes finished yet'
        : `Thru ${board.thru} hole${board.thru===1?'':'s'}${board.potValue > 1 ? ` — ${board.potValue} skins carried into the next hole` : ''}`;
      wrap.appendChild(skHint);

      const skList = document.createElement('div');
      skList.className = 'leader-list';
      board.ranked().forEach((entry, idx)=>{
        const row = document.createElement('div');
        row.className = 'leader-row';
        if (idx === 0 && entry.total > 0) row.classList.add('lb-gold');
        else if (idx === 1 && entry.total > 0) row.classList.add('lb-silver');
        else if (idx === 2 && entry.total > 0) row.classList.add('lb-bronze');
        if (state.colorBlindMode) row.classList.add('cb');
        row.innerHTML = `
          <div class="rank">${idx+1}</div>
          <div class="name">${escapeHtml(entry.label)}</div>
          <div class="pts">${entry.total}</div>
        `;
        skList.appendChild(row);
      });
      wrap.appendChild(skList);
    }

    // Team game on top, player game below it, Stableford leaderboards after
    // — and only the sections that are actually validly configured show up
    // at all (e.g. no Team Game section if there's no valid 2-team Matchplay,
    // 2+ team Skins, or exactly-3-team Split Sixes set up).
    let anySpecialSection = false;

    if (state.teamGameType === 'Matchplay'){
      const board = computeLiveMatchplay('teams');
      if (board){ buildMatchplaySummaryCard(board, 'Team Matchplay', !anySpecialSection); anySpecialSection = true; }
    } else if (state.teamGameType === 'Skins'){
      const board = computeLiveSkins('teams');
      if (board){ buildPointsLeaderboard(board, 'Team Skins', !anySpecialSection); anySpecialSection = true; }
    } else if (state.teamGameType === 'Split Sixes'){
      const board = computeLiveSplitSixes('teams');
      if (board){ buildPointsLeaderboard(board, 'Team Split Sixes', !anySpecialSection); anySpecialSection = true; }
    }

    if (state.playersGameType === 'Matchplay'){
      const board = computeLiveMatchplay('players');
      if (board){ buildMatchplaySummaryCard(board, 'Players Matchplay', !anySpecialSection); anySpecialSection = true; }
    } else if (state.playersGameType === 'Skins'){
      const board = computeLiveSkins('players');
      if (board){ buildPointsLeaderboard(board, 'Players Skins', !anySpecialSection); anySpecialSection = true; }
    } else if (state.playersGameType === 'Split Sixes'){
      const board = computeLiveSplitSixes('players');
      if (board){ buildPointsLeaderboard(board, 'Players Split Sixes', !anySpecialSection); anySpecialSection = true; }
    }

    // Section heading for the individual board
    const mainTitle = document.createElement('div');
    mainTitle.className = 'section-title';
    if (!anySpecialSection) mainTitle.style.marginTop = '0';
    mainTitle.textContent = 'Individual Overall Leaderboard';
    wrap.appendChild(mainTitle);

    // Summary always sits at the top of the tab
    const title = document.createElement('div');
    title.className = 'hint';
    title.style.margin = '0 0 10px';
    title.textContent = `${state.completedRounds.length} round${state.completedRounds.length===1?'':'s'} finished${liveInProgress ? ' + live round in progress' : ''}`;
    wrap.appendChild(title);

    if (ranked.length === 0){
      const empty = document.createElement('div');
      empty.className = 'hint';
      empty.textContent = 'Add players and start entering scores — the table updates live as you go, and "Finish Round" locks a round in permanently.';
      wrap.appendChild(empty);
      return wrap;
    }

    function renderLeaderList(entries, colorBorder){
      const list = document.createElement('div');
      list.className = 'leader-list';
      entries.forEach((entry, idx)=>{
        const row = document.createElement('div');
        row.className = 'leader-row';
        const isLast = idx === entries.length - 1 && entries.length > 1;
        if (idx === 0) row.classList.add('lb-gold');
        else if (idx === 1) row.classList.add('lb-silver');
        else if (idx === 2) row.classList.add('lb-bronze');
        if (isLast && entries.length > 3) row.classList.add('lb-last');
        if (state.colorBlindMode) row.classList.add('cb');
        if (colorBorder && entry.color){
          row.style.border = `11px solid ${entry.color}`;
          row.style.borderRadius = '14px';
          row.style.boxSizing = 'border-box';
        }

        row.innerHTML = `
          <div class="rank">${idx+1}</div>
          <div class="name">${escapeHtml(entry.name)}${isLast ? ' <span aria-hidden="true">💩</span>' : ''}<div class="thru">${entry.subLine}</div></div>
          <div class="pts">${entry.pts}</div>
        `;
        list.appendChild(row);
      });
      return list;
    }

    const individualEntries = ranked.map(entry=>{
      let subLine = `${entry.gross} Gross Score, Thru ${entry.liveThru}`;
      if (state.numRounds > 1) subLine += `, ${entry.roundsFinished} round${entry.roundsFinished===1?'':'s'} complete`;
      return { name: entry.name, color: entry.color, pts: entry.pts, subLine };
    });
    wrap.appendChild(renderLeaderList(individualEntries));

    // Current Round Leaderboard — same look and ranking rules as the overall
    // board above, but scoped to just this live round (no historical rounds
    // folded in). Only worth showing once it can actually differ from the
    // overall board: a multi-round competition, with at least one round
    // already finished and another now underway. Before that (e.g. still on
    // round 1), it would just be a duplicate of the overall board.
    if (state.numRounds > 1 && state.completedRounds.length >= 1){
      const currentTitle = document.createElement('div');
      currentTitle.className = 'section-title';
      currentTitle.textContent = 'Current Round Leaderboard';
      wrap.appendChild(currentTitle);

      const currentRoundEntries = state.players.map(p=>{
        const { pts, gross, thru } = playerTotals(p);
        return { name: p.name, color: p.color, pts, subLine: `${gross} Gross Score, Thru ${thru}` };
      }).sort((a,b)=> b.pts - a.pts);
      wrap.appendChild(renderLeaderList(currentRoundEntries));
    }

    // Team Round Leaderboard — same points, same ranking rules, summed per
    // team, but also scoped to just this live round to match the board above.
    if (state.teams.length > 0){
      const teamTitle = document.createElement('div');
      teamTitle.className = 'section-title';
      teamTitle.textContent = 'Team Round Leaderboard';
      wrap.appendChild(teamTitle);

      const teamTotals = {};
      state.teams.forEach(t=>{
        teamTotals[t.id] = { id: t.id, name: t.name, color: t.color, pts: 0, gross: 0, memberCount: 0, liveThru: 0 };
      });
      state.players.forEach(p=>{
        if (!p.teamId || !teamTotals[p.teamId]) return;
        const { pts, gross, thru } = playerTotals(p);
        const tt = teamTotals[p.teamId];
        tt.pts += pts;
        tt.gross += gross;
        tt.memberCount += 1;
        if (thru > tt.liveThru) tt.liveThru = thru;
      });

      const teamsWithMembers = Object.values(teamTotals).filter(t=>t.memberCount > 0);
      if (teamsWithMembers.length === 0){
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = 'Assign players to teams in the Players tab to see a team leaderboard.';
        wrap.appendChild(hint);
      } else {
        const rankedTeams = teamsWithMembers.sort((a,b)=> b.pts - a.pts);
        const teamEntries = rankedTeams.map(t=>{
          const subLine = `${t.gross} Gross Score, Thru ${t.liveThru}, ${t.memberCount} player${t.memberCount===1?'':'s'}`;
          return { name: t.name, color: t.color, pts: t.pts, subLine };
        });
        wrap.appendChild(renderLeaderList(teamEntries, true));
      }
    }

    // Round-by-round breakdown
    if (state.completedRounds.length > 0){
      const subTitle = document.createElement('div');
      subTitle.className = 'section-title';
      subTitle.textContent = 'Rounds Played';
      wrap.appendChild(subTitle);

      state.completedRounds.slice().reverse().forEach(round=>{
        const card = document.createElement('div');
        card.style.background = '#fff';
        card.style.border = '1.5px solid var(--line)';
        card.style.borderRadius = '10px';
        card.style.padding = '10px 14px';
        card.style.marginBottom = '8px';
        const dateStr = new Date(round.date).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
        let rows = round.entries.slice().sort((a,b)=>b.pts-a.pts).map(e=>
          `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
            <span>${escapeHtml(e.name)}</span>
            <span style="font-weight:700;">${e.pts} pts · ${e.gross}</span>
          </div>`
        ).join('');
        card.innerHTML = `<div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">${escapeHtml(round.courseName)}</div><div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;">${dateStr} · ${round.numHoles} holes</div>${rows}`;
        wrap.appendChild(card);
      });
    }

    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn btn-outline';
    clearBtn.style.marginTop = '18px';
    clearBtn.textContent = 'Clear Competition History';
    clearBtn.onclick = ()=>{
      if (confirm('Remove all saved rounds from the leaderboard? This cannot be undone.')){
        state.completedRounds = [];
        render();
      }
    };
    wrap.appendChild(clearBtn);

    return wrap;
  }

  // Dynamic contrast: given any hex background colour (player colours, team
  // colours, etc. all vary), work out whether black or white text reads best
  // on it, rather than assuming one fixed text colour works for every shade.
  // Measures rendered text width in px for a given CSS font shorthand, used
  // to size the team dropdown to its selected name rather than relying on
  // native <select> auto-sizing (which sizes to the widest OPTION in the
  // list, not just the one currently selected/displayed).
  function measureTextPx(text, font){
    if (!measureTextPx._canvas) measureTextPx._canvas = document.createElement('canvas');
    const ctx = measureTextPx._canvas.getContext('2d');
    ctx.font = font;
    return ctx.measureText(text).width;
  }

  function contrastTextColor(hex){
    if (!hex) return '#22261F';
    const c = hex.replace('#','');
    if (c.length !== 6) return '#22261F';
    const r = parseInt(c.substring(0,2),16);
    const g = parseInt(c.substring(2,4),16);
    const b = parseInt(c.substring(4,6),16);
    // Perceived brightness (standard luminance weighting)
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.6 ? '#22261F' : '#FFFFFF';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Swipe left/right anywhere on the Scores tab to move between holes, same as
  // tapping the ‹ / › arrows. Attached once to the document (not rebuilt on every
  // render) so it keeps working no matter how the DOM underneath it changes.
  let swipeStartX = null, swipeStartY = null;
  document.addEventListener('touchstart', (e)=>{
    if (state.tab !== 'play' || e.touches.length !== 1) return;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e)=>{
    if (state.tab !== 'play' || swipeStartX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - swipeStartX;
    const dy = t.clientY - swipeStartY;
    swipeStartX = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if (dx < 0 && state.currentHole < state.numHoles - 1){
        generateAutoNotifications(state.currentHole);
        state.currentHole++; render();
      } else if (dx > 0 && state.currentHole > 0){
        generateAutoNotifications(state.currentHole);
        state.currentHole--; render();
      }
    }
  }, { passive: true });

  render();
  loadFavourites();
})();
</script>
</body>
</html>
