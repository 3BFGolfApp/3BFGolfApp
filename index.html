<meta name="apple-mobile-web-app-title" content="3BF Golf">

<style>
  @font-face {
    font-family: 'Scorecard';
    src: local('Georgia');
  }
  html, body {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  :root {
    --fairway: #1F3D2B;
    --turf: #4A7C59;
    --turf-light: #E4EDE3;
    --cream: #F7F4EC;
    --flag: #C1443C;
    --ink: #22261F;
    --ink-soft: #5B6157;
    --gold: #C9A24B;
    --line: #D8D3C4;
    --tab: #5E9271;
    --tab-text: #EAF3EC;
    --strokes-circle: #5B8FC7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  .display {
    font-family: Georgia, 'Times New Roman', serif;
    font-stretch: condensed;
  }
  #app { max-width: 480px; margin: 0 auto; padding-bottom: 40px; min-height: 100vh; background: var(--cream); }

  /* Header */
  header {
    background: var(--fairway);
    color: var(--cream);
    padding: 12px 18px 10px;
    position: sticky; top: 0; z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-top-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .header-title-block { min-width: 0; flex: 1; }
  .brand-badge {
    width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    display: block;
  }
  .brand-badge-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; flex-shrink: 0;
  }
  .brand-rules-link {
    font-size: 9px; font-weight: 700; letter-spacing: 0.4px;
    color: #C7D8C9;
  }
  header h1 {
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: 800;
    margin: 0 0 2px;
    letter-spacing: 0.2px;
  }
  header p { margin: 0; font-size: 11.5px; color: #C7D8C9; }
  .session-chip {
    margin-top: 8px; font-size: 11px; color: #C7D8C9;
    background: rgba(255,255,255,0.08); border-radius: 6px;
    padding: 5px 8px; display: inline-block;
  }
  .session-chip strong { color: var(--cream); letter-spacing: 1px; }
  nav.tabs {
    display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap;
  }
  nav.tabs button {
    flex: 1 1 auto; min-width: 76px; border: none; padding: 7px 4px; border-radius: 7px;
    background: var(--tab); color: var(--tab-text);
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  nav.tabs button.active { background: var(--cream); color: var(--fairway); }

  main { padding: 18px 18px 8px; }
  main.has-bottom-bar { padding-bottom: 76px; }
  main.has-chat-composer { padding-bottom: 158px; }

  .bottom-tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: flex; background: var(--fairway);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-tabs button {
    flex: 1 1 auto; border: none; padding: 9px 4px; margin: 0 2px; border-radius: 7px;
    background: var(--tab); color: var(--tab-text);
    font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .bottom-tabs button.active { background: var(--cream); color: var(--fairway); }
  .bottom-tabs button.has-unread { background: var(--flag); color: #fff; }
  .bottom-tabs button.has-unread.active { background: var(--flag); color: #fff; box-shadow: inset 0 0 0 2px var(--cream); }

  .notif-row {
    background: #fff; border: 1.5px solid var(--line); border-radius: 9px;
    padding: 11px 13px; margin-bottom: 8px;
  }
  .notif-msg { font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.35; }
  .notif-time { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  .chat-box {
    position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom));
    z-index: 24; background: var(--cream); border-top: 1.5px solid var(--line);
    padding: 10px 18px; box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
  }
  .chat-sender {
    width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 7px;
    font-size: 13px; background: var(--turf-light); color: var(--ink); font-weight: 600;
    margin-bottom: 8px;
  }
  .chat-row { display: flex; gap: 8px; align-items: center; }
  .chat-input {
    flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line);
    border-radius: 8px; font-size: 15px; background: #fff; color: var(--ink);
  }
  .chat-input:focus { outline: none; border-color: var(--turf); }
  .chat-send {
    flex-shrink: 0; border: none; border-radius: 8px; padding: 10px 16px;
    background: var(--fairway); color: var(--cream); font-size: 14px; font-weight: 700;
    cursor: pointer;
  }

  /* Setup screen */
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft); margin-bottom: 6px; text-transform: none;
  }
  .field input, .field select {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--line);
    border-radius: 8px; font-size: 16px; background: #fff; color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--turf); }
  .game-static-value {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--line);
    border-radius: 8px; font-size: 16px; background: #fff; color: var(--ink);
    box-sizing: border-box; font-weight: 400;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  .players-summary { margin-bottom: 4px; }
  .player-summary-table {
    border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; background: #fff;
  }
  .pst-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center;
    text-align: center; padding: 9px 8px; border-bottom: 1px solid var(--line);
  }
  .pst-row:last-child { border-bottom: none; }
  .pst-header {
    background: var(--turf-light); font-size: 11px; font-weight: 700;
    color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px;
    padding: 7px 8px;
  }
  .pst-name, .pst-team {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 13px; font-weight: 600; min-width: 0;
  }
  .pst-unassigned { color: var(--ink-soft); font-weight: 400; }
  .color-pill {
    display: inline-block; padding: 3px 9px; border-radius: 20px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }

  .player-card {
    background: #fff; border: 1.5px solid var(--line); border-radius: 10px;
    margin-bottom: 10px; overflow: hidden;
    display: flex; align-items: stretch;
  }
  .player-card-line { flex-wrap: nowrap; }
  .team-group-wrap {
    border-radius: 14px; padding: 3px; margin-bottom: 10px; box-sizing: border-box;
  }
  .team-group-wrap .player-card { margin-bottom: 4px; }
  .team-group-wrap .player-card:last-child { margin-bottom: 0; }

  .score-entry {

  .score-left { flex-shrink: 0; width: 96px; text-align: left; display: flex; flex-direction: column; gap: 9px; }

  .stepper { display: flex; align-items: center; gap: 6px; justify-content: center; }

    flex-shrink: 0;

  .score-meta { text-align: center; margin-top: 3px; }
  .score-meta .net-line { font-size: 10px; color: var(--ink-soft); }
  .score-meta .pts { font-weight: 700; color: var(--fairway); }

  .score-flags {

  .flag-box {

    -webkit-user-select: none; user-select: none; touch-action: manipulation;

  .flag-sq-tick::after {

    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .flag-sq-count {
    background: var(--flag); border-color: var(--flag); color: #fff;

  }

  /* Score badge (Enter Scores tab) */
  .score-badge {
    position: relative; width: 54px; height: 54px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    margin: 0; flex-shrink: 0;
  }
  .sb-empty {

  .sc-team-name-inline {

  }
  .sc-team-footer-row td { padding: 0 !important; border: none; border-radius: 0 0 12px 12px; height: 20px !important; box-sizing: border-box; }

  /* Points sub-row: smaller, lighter badges so it reads as a quieter sub-line */
  .pts-subrow .sb-scale-wrap { width: 46px; height: 46px; }
  .pts-subrow .sb-scale-wrap .score-badge { transform: translate(-50%, -50%) scale(0.852); }
  .pts-subrow .sb-num { font-size: 26px; font-weight: 500; }

  .mp-cell { position: relative; overflow: hidden; }
  .mp-diag {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent calc(50% - 0.5px), var(--line) calc(50% - 0.5px), var(--line) calc(50% + 0.5px), transparent calc(50% + 0.5px));
  }
  .mp-diag-mp-play-up { background: linear-gradient(135deg, transparent 50%, #3E8E5A 50%); }
  .mp-diag-mp-play-dn { background: linear-gradient(135deg, transparent 50%, #C1443C 50%); }
  .mp-diag-mp-play-as { background: linear-gradient(135deg, transparent 50%, #8A8F87 50%); }
  .mp-diag-skins { background: linear-gradient(135deg, transparent 50%, #C9A227 50%); }
  .mp-diag-splitsixes { background: linear-gradient(135deg, transparent 50%, #6B5BAA 50%); }
  .mp-stableford {
    position: absolute; top: 15px; left: 15px; transform: translate(-50%, -50%);
    font-size: 17px; font-weight: 700; color: var(--ink);
  }
  .mp-status {
    position: absolute; bottom: 9px; right: 5px; text-align: right; white-space: nowrap;
    font-size: 11px; font-weight: 800; color: var(--fairway);
  }
  .mp-status-mp-play-up, .mp-status-mp-play-dn, .mp-status-mp-play-as, .mp-status-skins, .mp-status-splitsixes { color: #fff; }
  .team-gap-row td { height: 10px; padding: 0; border: none; }
  .pts-subrow .sb-empty { font-size: 15px; }
  .sb-num {
    position: relative; z-index: 2; font-family: Georgia, serif;
    font-weight: 700; font-size: 23px; color: #000;
  }
  .sb-ring {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    border: 2px solid #000; box-sizing: border-box;
  }
  .sb-ring-circle { border-radius: 50%; }
  .sb-ring-square { border-radius: 4px; }
  .sb-triangle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 46px; height: 46px;
  }
  .sb-triangle polygon { fill: none; stroke: #000; stroke-width: 2.5; stroke-linejoin: round; }

  .sb-hole1 {
    background: linear-gradient(135deg, #FCE79B, #C9A227, #FCE79B, #E9C558);
    background-size: 260% 260%;
    animation: sb-shimmer 1.4s ease-in-out infinite, sb-pulse 1.1s ease-in-out infinite;
    box-shadow: 0 0 0 2px #000 inset, 0 0 14px 3px rgba(201,162,39,0.75);
  }
  .sb-num-hole1 { position: relative; z-index: 2; font-size: 30px; color: #000; font-weight: 800; font-family: Georgia, serif; }
  .sb-spark {
    position: absolute; color: #fff; font-size: 10px; z-index: 3;
    animation: sb-twinkle 1s ease-in-out infinite; text-shadow: 0 0 4px #fff, 0 0 2px #000;
  }
  .sb-spark-1 { top: 1px; left: 3px; animation-delay: 0s; }
  .sb-spark-2 { top: 1px; right: 3px; animation-delay: 0.3s; }
  .sb-spark-3 { bottom: 1px; left: 5px; animation-delay: 0.6s; }
  .sb-spark-4 { bottom: 1px; right: 5px; animation-delay: 0.9s; }

  @keyframes sb-shimmer {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes sb-pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  @keyframes sb-twinkle {
    0%,100% { opacity: 0.15; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.25); }
  }

  /* Leaderboard — football league table style */
  .leader-list {
    border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden;
    margin-bottom: 8px;
  }
  .leader-row {
    display: flex; align-items: center; gap: 10px; background: #fff;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .leader-row:last-child { border-bottom: none; }
  .leader-row .rank {
    font-family: Georgia, serif; font-size: 16px; font-weight: 700; color: var(--fairway);
    width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.65);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .leader-row .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leader-row .name { flex: 1; font-weight: 700; font-size: 14.5px; }
  .leader-row .thru { font-size: 11px; color: var(--ink-soft); font-weight: 400; margin-top: 1px; }
  .leader-row .pts { font-family: Georgia, serif; font-size: 20px; font-weight: 700; color: var(--fairway); }
  .leader-row.lb-gold   { background: #E8D9A0; }
  .leader-row.lb-silver { background: #DCDCDC; }
  .leader-row.lb-bronze { background: #DFB88C; }
  .leader-row.lb-last   { background: #C6AC91; }
  /* Colour-blind-safe alternates: gold/bronze/last sit close together on the
     yellow-orange-brown axis above, which is hard to tell apart under
     red-green colour blindness. These swap to hues that stay distinct. */
  .leader-row.lb-gold.cb   { background: #BFE0F0; }
  .leader-row.lb-bronze.cb { background: #F0D9A8; }
  .leader-row.lb-last.cb   { background: #E8C6D9; }

  .history-table-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--tab);

  .multi-col-table {
    border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; background: #fff;

  .multi-col-row span:first-child { font-weight: 700; }
  .multi-col-row span:last-child { font-weight: 700; }
  .multi-col-header {
    background: var(--turf-light); font-size: 11px; font-weight: 700;

    padding: 8px;

  .multi-col-row-wrap { border-bottom: 1px solid var(--line); }

  .multi-col-row-wrap .multi-col-row { border-bottom: none; padding-bottom: 4px; }
  .multi-col-note {
    font-size: 11.5px; color: var(--ink-soft); line-height: 1.45;
    padding: 0 12px 12px; text-align: left;
  }
  .history-callout {
    background: #fff; border: 1.5px solid var(--line); border-radius: 9px;

  .rules-field-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1.5px solid var(--line); border-radius: 9px;
    padding: 12px 14px; margin-bottom: 8px;

  .rules-field-input {
    width: 72px; padding: 8px; text-align: center; font-size: 15px; font-weight: 700;
    border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff;
  }

  .rules-games-list { display: flex; flex-direction: column; gap: 8px; }
  .rules-game-card {
    background: #fff; border: 1.5px solid var(--line); border-radius: 9px;
    padding: 12px 14px;
  }
  .rules-game-name { font-weight: 800; font-size: 14px; color: var(--fairway); margin-bottom: 3px; }
  .rules-game-text { font-size: 12.5px; color: var(--ink); line-height: 1.45; }

  .quotes-list { display: flex; flex-direction: column; gap: 8px; }
  .quote-card {
    background: #fff; border: 1.5px solid var(--line); border-radius: 9px;
    padding: 12px 14px;
  }
  .quote-text { font-size: 13.5px; font-style: italic; color: var(--ink); line-height: 1.4; }
  .quote-who { font-size: 11.5px; font-weight: 700; color: var(--tab); margin-top: 5px; }
  .quote-sub { font-size: 11px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; }

  table.card { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 10px; }
  table.card th, table.card td { padding: 5px 5px; text-align: center; border-bottom: 1px solid var(--line); }
  table.card th { color: var(--ink-soft); font-weight: 600; font-size: 13px; }
  table.card td:first-child, table.card th:first-child { text-align: left; font-weight: 700; }
  table.card.compact th, table.card.compact td { padding: 4px 4px; line-height: 1.2; font-size: 14.5px; }
  table.card.compact tr { border-bottom: 1px solid var(--line); }

  .scorecard-scroll {
    width: auto; overflow-x: auto; -webkit-overflow-scrolling: touch;
    border-radius: 8px; margin: 0 -18px; padding: 0 8px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .scorecard-scroll::-webkit-scrollbar { display: none; }
  .scorecard-scroll table.card { min-width: 100%; }
  .scorecard-scroll table.card th:first-child,
  .scorecard-scroll table.card td:first-child {
    position: sticky; left: 0; background: var(--cream); z-index: 5;

  .sb-scale-wrap {
    position: relative; display: inline-block;
    width: 46px; height: 46px; vertical-align: middle;
  }
  .sb-scale-wrap .score-badge {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.852);
    transform-origin: center;

  .sb-scale-wrap .sb-input-hole1 { font-size: 23px; width: 34px; font-weight: 700; }
  .sb-scale-wrap .sb-num-hole1 { font-size: 23px; }
  .sb-scale-wrap .sb-hole1 { box-shadow: 0 0 0 2px #000 inset; animation: sb-shimmer 1.4s ease-in-out infinite; }

  .sb-input {
    position: relative; z-index: 2; width: 34px; padding: 0; text-align: center;
    border: none; background: transparent; -moz-appearance: textfield;
    font-family: Georgia, serif; font-weight: 700; font-size: 23px; color: #000;
  }
  .sb-input:focus { outline: none; }
  .sb-input-empty { color: var(--ink-soft); font-size: 20px; width: 40px; }
  .sb-input-hole1 { font-size: 30px; width: 40px; font-weight: 800; }
  .sb-input::-webkit-outer-spin-button,
  .sb-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .legend-dot {
    width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 3px; vertical-align: middle;
  }
  .legend-dot.sc-albatross { background: #D9BB5E; }
  .legend-dot.sc-eagle     { background: #8FB4C9; }
  .legend-dot.sc-birdie    { background: #93BA9B; border-radius: 50%; }
  .legend-dot.sc-par       { background: var(--line); }
  .legend-dot.sc-bogey     { background: #F0EA00; }
  .legend-dot.sc-double    { background: #DFA372; }
  .legend-dot.sc-triple    { background: #C98A7D; }

<script type="module">
  // Firestore powers live sync between different friends' phones for a
  // shared game code. This replaces an earlier approach (window.storage,
  // Claude's own Artifact storage) that only actually worked when the app
  // was viewed inside Claude's own interface — which isn't how this app is
  // really used (downloaded and opened directly). Firestore works from any
  // browser, on any device, with no dependency on where the file is opened.
  //
  // NOTE: this is set up in Firestore "test mode" for now, which allows
  // open read/write to anyone with the project's config — fine while
  // getting this working, but this should be tightened with proper
  // Firestore Security Rules before relying on it long-term (e.g. rules
  // that only allow reading/writing a session document if you know its
  // code, and/or expire old sessions).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCsHyVFAkopkvcJNFAiTf3vN2BvEPFMbRk",
    authDomain: "bfgolfapp.firebaseapp.com",
    projectId: "bfgolfapp",
    storageBucket: "bfgolfapp.firebasestorage.app",
    messagingSenderId: "285569704173",
    appId: "1:285569704173:web:60642e8a473238601eace4"
  };

  const app = initializeApp(firebaseConfig);
  // Reverted experimentalForceLongPolling — measured slower in practice
  // (~30s vs ~10s), the opposite of its intended effect for this setup.
  // Back to Firestore's default connection negotiation.
  const db = getFirestore(app);

  window.__firebaseSync = {
    ready: true,
    async push(sessionCode, data){
      await setDoc(doc(db, 'sessions', sessionCode), data);
    },
    async getOnce(sessionCode){
      const snap = await getDoc(doc(db, 'sessions', sessionCode));
      return snap.exists() ? snap.data() : null;
    },
    // Real-time listener — fires immediately on any change from any device,
    // no polling delay. Returns an unsubscribe function.
    listen(sessionCode, callback){
      return onSnapshot(doc(db, 'sessions', sessionCode), (snap)=>{
        if (snap.exists()) callback(snap.data());
      }, (err)=>{ console.error('Firestore listen error:', err); });
    },
  };
  window.dispatchEvent(new Event('firebase-ready'));

  // Firestore's first read/write on a fresh page load pays the cost of
  // establishing its connection (a handshake that can take several seconds,
  // sometimes much longer on a slow or cellular connection) — normally that
  // delay lands on whatever the user's first action happens to be, which
  // makes tapping "Start a New Game" feel like the app has frozen. Firing a
  // harmless read immediately on load instead means that cost is usually
  // already paid by the time the user actually taps anything.
  getDoc(doc(db, '_warmup', '_ping')).catch(()=>{});
</script>
<div id="app"></div>

  const SWATCHES = ['#9DB8A3','#D9A7A0','#D6C089','#9FB4C7','#B6A0C2','#CBA888'];
  // Colour-blind-safe alternate palette (based on the widely-used Okabe-Ito
  // set), chosen to stay distinguishable under the common forms of colour
  // blindness (deuteranopia/protanopia/tritanopia) rather than relying on
  // red/green or green/brown hue differences.
  const SWATCHES_CB = ['#E69F00','#56B4E9','#009E73','#0072B2','#D55E00','#CC79A7'];
  function getSwatches(){ return state.colorBlindMode ? SWATCHES_CB : SWATCHES; }

  // The first 4 teams created always get these specific colours, in order;
  // any team beyond the 4th falls back to the normal player/team swatch
  // palette so it still gets something distinct.
  const TEAM_COLORS = ['#07061E', '#264833', '#C12D35', '#3778C9'];
  function getTeamColor(index){
    if (index < TEAM_COLORS.length) return TEAM_COLORS[index];
    return getSwatches()[index % getSwatches().length];
  }

  // When the colour-blind toggle flips, remap every existing player's and
  // team's colour across to the same position in the other palette, so the
  // whole app actually re-colours itself immediately rather than only
  // affecting players/teams added from this point on.
  // Full app-wide colour theme. Everything — header, buttons, tabs, badges,
  // leaderboard — is built on these CSS custom properties, so swapping them
  // re-colours the whole app in one place rather than chasing individual
  // components. The colour-blind theme moves the app's primary/accent hues
  // off the green-vs-red axis (the pairing that's hardest to tell apart
  // under the common red-green colour blindnesses) onto a blue/orange/teal
  // axis instead, which stays distinguishable across deuteranopia,
  // protanopia, and tritanopia.
  const NORMAL_THEME = {
    '--fairway': '#1F3D2B',
    '--turf': '#4A7C59',
    '--turf-light': '#E4EDE3',
    '--flag': '#C1443C',
    '--tab': '#5E9271',
    '--tab-text': '#EAF3EC',
    '--strokes-circle': '#5B8FC7',
  };
  const COLORBLIND_THEME = {
    '--fairway': '#0D3B66',       // deep blue — replaces dark green as the primary/header colour
    '--turf': '#3E7CB1',          // mid blue — replaces the secondary green accent
    '--turf-light': '#DCEAF5',    // pale blue — replaces the pale green background tint
    '--flag': '#D55E00',          // vermillion — replaces red for warnings/last-place/destructive actions
    '--tab': '#5A9BC4',           // lighter blue — inactive tab bar buttons
    '--tab-text': '#EAF3FA',
    '--strokes-circle': '#009E73', // teal — kept distinct from the two blues above
  };
  function applyColorTheme(){
    const theme = state.colorBlindMode ? COLORBLIND_THEME : NORMAL_THEME;
    Object.keys(theme).forEach(k => document.documentElement.style.setProperty(k, theme[k]));
  }

  function remapColorsForColorBlindMode(){
    const fromPalette = state.colorBlindMode ? SWATCHES : SWATCHES_CB;
    const toPalette = state.colorBlindMode ? SWATCHES_CB : SWATCHES;
    const remap = (color)=>{
      const idx = fromPalette.indexOf(color);
      return idx >= 0 ? toPalette[idx] : color;
    };
    state.players.forEach(p=>{ p.color = remap(p.color); });
    state.teams.forEach(t=>{ t.color = remap(t.color); });
  }

  // A real toggle switch (not two buttons) for Colour Blind Mode — tap
  // anywhere on it to flip, or drag/swipe the knob to either side with a
  // finger or mouse. Uses Pointer Events so touch and mouse both work the
  // same way. Dragging only updates the DOM directly (no render() mid-drag,
  // which would be janky); the state only actually commits — and triggers
  // the colour remap — once the finger/mouse lifts.
  function buildColorBlindSwitch(){
    const TRACK_W = 52, TRACK_H = 30, KNOB = 24, PAD = 3;
    const maxX = TRACK_W - KNOB - PAD; // knob's x position when "on"

    const track = document.createElement('div');
    track.className = 'cb-switch-track';
    track.style.width = TRACK_W + 'px';
    track.style.height = TRACK_H + 'px';

    const knob = document.createElement('div');
    knob.className = 'cb-switch-knob';
    knob.style.width = KNOB + 'px';
    knob.style.height = KNOB + 'px';
    track.appendChild(knob);

    function paint(isOn){
      track.style.background = isOn ? 'var(--fairway)' : '#D8D3C4';
      knob.style.transform = `translateX(${isOn ? maxX : PAD}px)`;
    }
    paint(state.colorBlindMode);

    let dragging = false, startX = 0, knobStartX = 0;

    const commit = (isOn)=>{
      if (isOn === state.colorBlindMode){ paint(isOn); return; }
      state.colorBlindMode = isOn;
      remapColorsForColorBlindMode();
      render();
    };

    track.addEventListener('pointerdown', (e)=>{
      dragging = true;
      startX = e.clientX;
      knobStartX = state.colorBlindMode ? maxX : PAD;
      knob.style.transition = 'none';
      track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', (e)=>{
      if (!dragging) return;
      const dx = e.clientX - startX;
      let newX = Math.min(maxX, Math.max(PAD, knobStartX + dx));
      knob.style.transform = `translateX(${newX}px)`;
      track.style.background = newX > (TRACK_W - KNOB) / 2 ? 'var(--fairway)' : '#D8D3C4';
    });
    const endDrag = (e)=>{
      if (!dragging) return;
      dragging = false;
      const dx = e.clientX - startX;
      const movedSignificantly = Math.abs(dx) > 4;
      const finalX = Math.min(maxX, Math.max(PAD, knobStartX + dx));
      const isOn = movedSignificantly ? finalX > (TRACK_W - KNOB) / 2 : !state.colorBlindMode;
      commit(isOn);
    };
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);

    return track;
  }

  // Favourite players and favourite courses are both personal to this
  // device (not shared with friends via the game code), saved under their
  // own separate keys so they can't collide with each other.
  //
  // Two storage backends, tried in order:
  //  1. window.storage — Claude's own Artifact storage, tied to your Claude
  //     account, syncs across devices. Only exists when this page is being
  //     viewed inside Claude's interface.
  //  2. localStorage — built into every browser, works for a plain
  //     downloaded HTML file opened directly (which is how this app is
  //     actually mostly used). Saved per-device/per-browser rather than per
  //     account, but that's the right trade-off for a file that gets
  //     downloaded and opened locally rather than hosted inside Claude.
  function hasClaudeStorage(){ return typeof window.storage !== 'undefined'; }

  function savePlayerFavourites(){
    const json = JSON.stringify(state.favourites);
    if (hasClaudeStorage()) window.storage.set('favourite-players', json, false).catch(()=>{});
    try {
      localStorage.setItem('golf-favourite-players', json);
      state._favSaveError = null;
    } catch (e) {
      // A previous version silently swallowed this — if localStorage is
      // blocked or full on a real device, favourites would look like they
      // saved (the in-memory state and the UI both update fine) but
      // silently vanish on next launch, with no visible sign anything
      // went wrong. Surfacing it now instead.
      state._favSaveError = (e && e.message) ? e.message : String(e);
      console.error('[favourites] localStorage save failed:', e);
    }
  }
  function saveCourseFavourites(){
    const json = JSON.stringify(state.favouriteCourses);
    if (hasClaudeStorage()) window.storage.set('favourite-courses-list', json, false).catch(()=>{});
    try { localStorage.setItem('golf-favourite-courses', json); } catch (e) { /* storage full or blocked — nothing we can do */ }
  }
  // Kept as aliases so existing calls elsewhere in the file don't need to change.
  function saveFavourites(){ savePlayerFavourites(); saveCourseFavourites(); }

  async function loadFavourites(){
    let loadedPlayers = false, loadedCourses = false;

    // Try Claude's storage first — if this page happens to be viewed inside
    // Claude, it's the better backend (syncs across your devices).
    if (hasClaudeStorage()){
      try {
        const result = await window.storage.get('favourite-players', false);
        if (result && result.value){
          const parsed = JSON.parse(result.value);
          if (Array.isArray(parsed)){ state.favourites = parsed; loadedPlayers = true; }
        }
      } catch (e) { /* nothing saved yet under this key */ }
      try {
        const result = await window.storage.get('favourite-courses-list', false);
        if (result && result.value){
          const parsed = JSON.parse(result.value);
          if (Array.isArray(parsed)){ state.favouriteCourses = parsed; loadedCourses = true; }
        }
      } catch (e) { /* nothing saved yet under this key */ }
    }

    // Fall back to localStorage — this is what actually applies for a
    // downloaded file opened directly in a phone's browser.
    if (!loadedPlayers){
      try {
        const raw = localStorage.getItem('golf-favourite-players');
        if (raw){
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)){ state.favourites = parsed; loadedPlayers = true; }
        }
      } catch (e) { /* nothing saved yet, or storage blocked */ }
    }
    if (!loadedCourses){
      try {
        const raw = localStorage.getItem('golf-favourite-courses');
        if (raw){
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)){ state.favouriteCourses = parsed; loadedCourses = true; }
        }
      } catch (e) { /* nothing saved yet, or storage blocked */ }
    }

    // One-time migration: an earlier version of the app stored player
    // favourites and course favourites mixed together under a single
    // "favourite-courses" key (a naming/data-model bug). If that's all we
    // find (in either backend), split it cleanly by shape and re-save
    // under the correct keys.
    if (!loadedPlayers && !loadedCourses){
      let legacyRaw = null;
      if (hasClaudeStorage()){
        try {
          const legacy = await window.storage.get('favourite-courses', false);
          if (legacy && legacy.value) legacyRaw = legacy.value;
        } catch (e) { /* nothing under the old Claude-storage key */ }
      }
      if (!legacyRaw){
        try { legacyRaw = localStorage.getItem('golf-favourite-courses-legacy'); } catch (e) { /* nothing under the old local key */ }
      }
      if (legacyRaw){
        try {
          const parsed = JSON.parse(legacyRaw);
          if (Array.isArray(parsed)){
            state.favourites = parsed.filter(f => f && typeof f.name === 'string');
            state.favouriteCourses = parsed.filter(f => f && typeof f.courseName === 'string');
            savePlayerFavourites();
            saveCourseFavourites();
          }
        } catch (e) { /* legacy value wasn't valid JSON — nothing to migrate */ }
      }
    }
    render();
  }

  function sharedStateContent(){
    return {
      courseName: state.courseName,
      selectedTee: state.selectedTee,
      numHoles: state.numHoles,
      numRounds: state.numRounds,
      hcpMode: state.hcpMode,

      teamGameType: state.teamGameType,

      competitionWinnerAdj: state.competitionWinnerAdj,

      players: state.players,
      teams: state.teams,
      completedRounds: state.completedRounds,
      notifications: state.notifications,
    };
  }

  function applySharedState(data){
    state.courseName = data.courseName;
    state.selectedTee = data.selectedTee;
    state.numHoles = data.numHoles;
    state.numRounds = data.numRounds || 1;
    state.hcpMode = data.hcpMode || 'calculate';
    state.playersGameType = data.playersGameType || 'Stableford';
    state.teamGameType = data.teamGameType || 'Stableford';
    state.noBirdieCurrent = data.noBirdieCurrent || state.noBirdieCurrent;
    state.maxHandicap = (data.maxHandicap !== undefined && data.maxHandicap !== null) ? data.maxHandicap : state.maxHandicap;
    state.competitionWinnerAdj = (data.competitionWinnerAdj !== undefined && data.competitionWinnerAdj !== null) ? data.competitionWinnerAdj : state.competitionWinnerAdj;
    state.holes = data.holes;
    state.players = data.players;
    state.teams = data.teams || [];
    state.completedRounds = data.completedRounds;
    state.notifications = data.notifications || [];
  }

  // Waits for the Firebase module script to finish loading (it's a
  // type="module" script, which loads async relative to this one) before
  // any Firestore call is attempted.
  function waitForFirebase(){
    if (window.__firebaseSync && window.__firebaseSync.ready) return Promise.resolve();
    return new Promise(resolve=>{
      window.addEventListener('firebase-ready', ()=> resolve(), { once: true });
    });
  }

  let unsubscribeSession = null; // set once a session is joined; call to stop listening

  // Called at the end of every render(). Only writes when the shared game
  // state actually changed, so tab switches / typing in a search box don't
  // spam Firestore.
  //
  // Every write is stamped with the current time, and the real-time
  // listener checks that stamp before applying anything (see the listener
  // callback in joinSession below). Without this, an update that happens to
  // arrive in the split second before our own write has actually landed
  // would read the old value, see it differs from the local state we'd
  // already moved on to, and "helpfully" overwrite the score someone just
  // entered — which is exactly the bug where a tap on +/- seemed to
  // silently vanish and had to be entered twice.
  function maybeSyncSession(){
    if (!state.sessionCode) return;
    const contentJSON = JSON.stringify(sharedStateContent());
    if (contentJSON === state._lastSyncedContent) return;
    state._lastSyncedContent = contentJSON;
    const now = Date.now();
    state._localWriteAt = now;
    const payload = Object.assign({ updatedAt: now }, JSON.parse(contentJSON));
    waitForFirebase().then(()=> window.__firebaseSync.push(state.sessionCode, payload)).catch(()=>{});
  }

  function generateSessionCode(){
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no O/0/I/1 to avoid mix-ups when read aloud
    let code = '';
    for (let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
    return code;
  }

  // Drives the "Connecting… Ns" button state with a live-updating counter.
  // Also tracks which specific phase is in progress (state._connectPhase),
  // shown directly on the button — this is diagnostic instrumentation, not
  // a fix by itself, so the next change can target whichever phase is
  // actually slow instead of guessing, and it's visible on the phone
  // screen itself without needing a computer hooked up to read console logs.
  function startConnectingWithTimer(action){
    state._connectingSession = true;
    state._connectStartedAt = Date.now();
    state._connectPhase = 'loading'; // 'loading' = waiting on the Firebase code itself; 'database' = waiting on the actual read
    render();
    const tickInterval = setInterval(render, 500);
    waitForFirebase().then(()=>{
      state._connectPhase = 'database';
    });
    action().finally(()=>{
      clearInterval(tickInterval);
      state._connectingSession = false;
      state._connectPhase = null;
      render();
    });
  }

  async function joinSession(code){
    state.sessionCode = code.trim().toUpperCase();
    await waitForFirebase();
    try {
      const data = await window.__firebaseSync.getOnce(state.sessionCode);
      if (data){
        applySharedState(data);
        const { updatedAt, ...content } = data;
        state._lastSyncedContent = JSON.stringify(content);
        state._localWriteAt = updatedAt || 0;
      } else {
        state._lastSyncedContent = null; // will force an initial save on first render
      }
      state._connectError = null;
    } catch (e) {
      // A genuine connection failure was previously being treated exactly
      // the same as "this is a brand new game code" — silently swallowed,
      // with no visible difference to the user, and the app carried on
      // regardless. Now it stays on the landing screen with the error
      // visible instead of silently proceeding into an unsynced session.
      state._connectError = (e && e.message) ? e.message : String(e);
      console.error('[connect] Firestore error:', e);
      render();
      return;
    }
    state.sessionJoined = true;

    // Real-time listener — fires the moment any device (including this one,
    // harmlessly) writes to this session's document. No polling delay.
    if (unsubscribeSession) unsubscribeSession();
    unsubscribeSession = window.__firebaseSync.listen(state.sessionCode, (data)=>{
      const incomingUpdatedAt = data.updatedAt || 0;
      if (incomingUpdatedAt < state._localWriteAt) return;
      const { updatedAt, ...content } = data;
      const contentJSON = JSON.stringify(content);
      if (contentJSON === state._lastSyncedContent) return;
      applySharedState(data);
      state._lastSyncedContent = contentJSON;
      render();
    });

    render();
  }

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function strokesReceived(hcp, si, numHoles){
    // Standard allocation: strokes are allocated as whole numbers, so a decimal
    // handicap is rounded to the nearest stroke first, then split across holes.
    const roundedHcp = Math.round(hcp);
    const base = Math.floor(roundedHcp / numHoles);
    const remainder = roundedHcp % numHoles;
    return base + (si <= remainder ? 1 : 0);
  }

  function pointsForNet(net, par){
    const diff = net - par;
    const pts = 2 - diff;
    return Math.max(0, pts);
  }

  function playerTotals(p){
    let pts = 0, thru = 0, gross = 0;
    for (let i = 0; i < state.numHoles; i++){
      const g = p.scores[i];
      if (g === undefined || g === null) continue;
      thru++;
      gross += g;
      const hole = state.holes[i];
      const strokes = strokesReceived(p.hcp, hole.si, state.numHoles);
      const net = g - strokes;
      pts += pointsForNet(net, hole.par);
    }
    return {pts, thru, gross};
  }

  // Shared matchplay engine for the CURRENT LIVE round — used by the
  // Scorecard, the Scores tab, and the Leaderboard so all three agree.
  // Only active when Game is set to Matchplay in Round Setup, and it's a
  // genuine 1v1: either exactly 2 players with no teams, or exactly 2 teams
  // in use. Hole-winners are decided by Stableford points (higher wins,
  // equal halves), same as the rest of the app.
  // When players are on teams, both the Scores tab and Scorecard show them
  // grouped by team — alphabetically first-team-first, and alphabetically
  // by name within each team. Players not on a team come last, also
  // alphabetical. With no teams at all, the original add-order is kept.
  // For Matchplay/warning-banner purposes: if exactly one real team has been
  // created and some players are left unassigned, treat "Unassigned" as the
  // second side automatically. Returns an array of {id, name, color, members}
  // — either the 2 real teams in play, or [realTeam, virtual "Unassigned"
  // team], or empty if neither shape applies.
  function getEffectiveTeamSides(){
    const realTeamsInPlay = state.teams.filter(t=>state.players.some(p=>p.teamId===t.id));
    const unassigned = state.players.filter(p=> !p.teamId || !state.teams.some(t=>t.id===p.teamId));
    if (realTeamsInPlay.length === 2){
      return realTeamsInPlay.map(t=>({ id: t.id, name: t.name, color: t.color, members: state.players.filter(p=>p.teamId===t.id) }));
    }
    if (realTeamsInPlay.length === 1 && unassigned.length > 0){
      const t = realTeamsInPlay[0];
      return [
        { id: t.id, name: t.name, color: t.color, members: state.players.filter(p=>p.teamId===t.id) },
        { id: '__unassigned__', name: 'Unassigned', color: '#B8B8B8', members: unassigned },
      ];
    }
    return [];
  }

  function getGroupedPlayers(){
    if (state.teams.length === 0){
      return { list: state.players.slice().sort((a,b)=> a.name.localeCompare(b.name)), teamBreaks: new Set() };
    }
    const sortedTeams = state.teams.slice().sort((a,b)=> a.name.localeCompare(b.name));
    const grouped = [];
    const teamBreaks = new Set();
    sortedTeams.forEach(t=>{
      const members = state.players.filter(p=>p.teamId === t.id).sort((a,b)=> a.name.localeCompare(b.name));
      if (members.length){
        grouped.push(...members);
        teamBreaks.add(grouped.length - 1);
      }
    });
    const unassigned = state.players
      .filter(p=> !p.teamId || !state.teams.some(t=>t.id===p.teamId))
      .sort((a,b)=> a.name.localeCompare(b.name));
    if (unassigned.length) grouped.push(...unassigned);
    teamBreaks.delete(grouped.length - 1); // no gap after the very last row
    return { list: grouped, teamBreaks };
  }

  // Full match-play state for one side at one hole: AS / normal "N UP"-"N DN"
  // / Dormy (level with holes left equal to the margin) / decided (margin
  // exceeds holes left — "Won/Lost N & M" in rich wording, both sides shown
  // symmetrically as "N&M" in compact wording, or "WN"/"LN" if only decided
  // on the very last hole, since "N&0" isn't real notation). "rich" mode is
  // the full wording (Scores tab, Leaderboard); "compact" is the short
  // scorecard notation.
  function matchStatusText(tally, holesLeft, side, mode){
    const margin = Math.abs(tally);
    if (margin === 0) return { text: 'AS', cls: 'mp-play-as' };
    const side0Up = tally > 0;
    const thisSideUp = side === 0 ? side0Up : !side0Up;
    const cls = thisSideUp ? 'mp-play-up' : 'mp-play-dn';
    if (margin > holesLeft){
      if (mode === 'compact'){
        if (holesLeft === 0) return { text: thisSideUp ? `W${margin}` : `L${margin}`, cls };
        return { text: `${margin}&${holesLeft}`, cls };
      }
      if (holesLeft === 0){
        const word = margin === 1 ? 'hole' : 'holes';
        return { text: thisSideUp ? `Won by ${margin} ${word}` : `Lost by ${margin} ${word}`, cls };
      }
      return { text: thisSideUp ? `Won ${margin} & ${holesLeft}` : `Lost ${margin} & ${holesLeft}`, cls };
    }
    if (margin === holesLeft) return { text: 'Dormy', cls };
    return { text: thisSideUp ? `${margin}UP` : `${margin}DN`, cls };
  }

  // Which Game options are offered depends on how many players (for the
  // "Players Game" selector) or how many teams are actually in use (for
  // "Team Game") there are — Matchplay needs exactly 2 a side, some formats
  // don't scale past a few players, etc.
  function gamesForCount(count, kind){
    if (count <= 1) return ['Stableford'];
    if (count === 2) return ['Stableford', 'Matchplay', 'Skins', 'Split Sixes'];
    if (count === 3) return ['Stableford', 'Skins', 'Split Sixes'];
    if (count === 4) return kind === 'teams' ? ['Stableford', 'Skins'] : ['Stableford', 'Skins', '3BF Match'];
    return ['Stableford', 'Skins']; // 5+
  }

  // Shared red warning banner used when a Game selection doesn't have a
  // workable number of players/teams behind it (e.g. Matchplay picked with
  // 3 players, or Split Sixes picked with 2).
  function buildGameConfigWarning(text){
    const el = document.createElement('div');
    el.style.background = 'rgba(193,68,60,0.1)';
    el.style.border = '1.5px solid var(--flag)';
    el.style.borderRadius = '9px';
    el.style.padding = '12px 14px';
    el.style.marginTop = '10px';
    el.style.fontSize = '13px';
    el.style.color = 'var(--flag)';
    el.style.fontWeight = '600';
    el.style.lineHeight = '1.4';
    el.textContent = text;
    return el;
  }

  // Skins — lowest NET score on a hole wins the skin(s) riding on it. A tie
  // for lowest means nobody wins, and the skin carries over (the next hole
  // is worth one more). mode 'players': every individual player is their
  // own entrant. mode 'teams': every team with at least one player is an
  // entrant, using that team's best (lowest) net score on the hole —
  // best-ball, same idea as team Matchplay. Only resolves a hole once every
  // entrant has a score in for it.
  function computeLiveSkins(mode){
    const numHolesVal = state.numHoles;
    const holesData = state.holes;
    let entrants = null; // [{ label, members: [players] }]

    if (mode === 'teams'){
      if (state.teamGameType !== 'Skins') return null;
      const teamsInPlay = state.teams.filter(t=>state.players.some(p=>p.teamId===t.id));
      if (teamsInPlay.length < 2) return null;
      entrants = teamsInPlay.map(t=>({ label: t.name, members: state.players.filter(p=>p.teamId===t.id) }));
    } else {
      if (state.playersGameType !== 'Skins') return null;
      if (state.players.length < 2) return null;
      entrants = state.players.map(p=>({ label: p.name, members: [p] }));
    }

    const netByHole = entrants.map(entry=>{
      const arr = [];
      for (let i=0;i<numHolesVal;i++){
        let best, any = false;
        entry.members.forEach(p=>{
          const g = p.scores[i];
          if (g === undefined || g === null) return;
          any = true;
          const strokes = strokesReceived(p.hcp, holesData[i].si, numHolesVal);
          const net = g - strokes;
          if (best === undefined || net < best) best = net;
        });
        arr.push(any ? best : undefined);
      }
      return arr;
    });

    const cumulative = entrants.map(()=> new Array(numHolesVal).fill(0));
    const runningTotal = entrants.map(()=> 0);
    let potValue = 1;
    let thru = 0;

    for (let i=0;i<numHolesVal;i++){
      const allPlayed = netByHole.every(arr => arr[i] !== undefined);
      if (allPlayed){
        thru = i + 1;
        const nets = netByHole.map(arr => arr[i]);
        const minNet = Math.min(...nets);
        const winners = [];
        nets.forEach((n, idx)=>{ if (n === minNet) winners.push(idx); });
        if (winners.length === 1){
          runningTotal[winners[0]] += potValue;
          potValue = 1;
        } else {
          potValue += 1;
        }
      }
      entrants.forEach((e, idx)=>{ cumulative[idx][i] = runningTotal[idx]; });
    }

    return {
      thru, potValue, entrants,
      cumulativeAt: (entryIdx, holeIdx)=> cumulative[entryIdx][holeIdx],
      totalFor: (entryIdx)=> runningTotal[entryIdx],
      ranked: ()=> entrants.map((e, idx)=>({ label: e.label, total: runningTotal[idx] })).sort((a,b)=> b.total - a.total),
      // Given a player, find which entrant's track applies to them (their
      // own row if mode is 'players', or their team's row if mode is 'teams').
      entryIndexForPlayer: (player)=>{
        for (let idx=0; idx<entrants.length; idx++){
          if (entrants[idx].members.includes(player)) return idx;
        }
        return -1;
      },
    };
  }

  // Split Sixes — a 3-way points game. Every hole has 6 points up for grabs,
  // split by net-score ranking: 4 to the lowest, 2 to the middle, 0 to the
  // highest. Ties share the points evenly between the tied spots: two tied
  // for lowest get 3 each (last gets 0); two tied for highest get 1 each
  // (winner still gets 4); all three tied get 2 each. No carryover — every
  // hole's 6 points are always paid out. Requires exactly 3 entrants.
  function splitSixesPoints(nets){
    const min = Math.min(...nets);
    const max = Math.max(...nets);
    const lowCount = nets.filter(n=> n === min).length;
    const highCount = nets.filter(n=> n === max).length;
    if (lowCount === 3) return nets.map(()=> 2);
    if (lowCount === 2) return nets.map(n=> n === min ? 3 : 0);
    if (highCount === 2) return nets.map(n=> n === min ? 4 : 1);
    return nets.map(n=> n === min ? 4 : (n === max ? 0 : 2));
  }

  function computeLiveSplitSixes(mode){
    const numHolesVal = state.numHoles;
    const holesData = state.holes;
    let entrants = null;

    if (mode === 'teams'){
      if (state.teamGameType !== 'Split Sixes') return null;
      const teamsInPlay = state.teams.filter(t=>state.players.some(p=>p.teamId===t.id));
      if (teamsInPlay.length !== 3) return null;
      entrants = teamsInPlay.map(t=>({ label: t.name, members: state.players.filter(p=>p.teamId===t.id) }));
    } else {
      if (state.playersGameType !== 'Split Sixes') return null;
      if (state.players.length !== 3) return null;
      entrants = state.players.map(p=>({ label: p.name, members: [p] }));
    }

    const netByHole = entrants.map(entry=>{
      const arr = [];
      for (let i=0;i<numHolesVal;i++){
        let best, any = false;
        entry.members.forEach(p=>{
          const g = p.scores[i];
          if (g === undefined || g === null) return;
          any = true;
          const strokes = strokesReceived(p.hcp, holesData[i].si, numHolesVal);
          const net = g - strokes;
          if (best === undefined || net < best) best = net;
        });
        arr.push(any ? best : undefined);
      }
      return arr;
    });

    const cumulative = entrants.map(()=> new Array(numHolesVal).fill(0));
    const runningTotal = entrants.map(()=> 0);
    let thru = 0;

    for (let i=0;i<numHolesVal;i++){
      const allPlayed = netByHole.every(arr => arr[i] !== undefined);
      if (allPlayed){
        thru = i + 1;
        const nets = netByHole.map(arr => arr[i]);
        const pts = splitSixesPoints(nets);
        pts.forEach((pt, idx)=>{ runningTotal[idx] += pt; });
      }
      entrants.forEach((e, idx)=>{ cumulative[idx][i] = runningTotal[idx]; });
    }

    return {
      thru, entrants,
      cumulativeAt: (entryIdx, holeIdx)=> cumulative[entryIdx][holeIdx],
      totalFor: (entryIdx)=> runningTotal[entryIdx],
      ranked: ()=> entrants.map((e, idx)=>({ label: e.label, total: runningTotal[idx] })).sort((a,b)=> b.total - a.total),
      entryIndexForPlayer: (player)=>{
        for (let idx=0; idx<entrants.length; idx++){
          if (entrants[idx].members.includes(player)) return idx;
        }
        return -1;
      },
    };
  }

  function computeLiveMatchplay(mode){
    // mode: 'teams' checks teamGameType and needs exactly 2 teams (or 1 team
    // + unassigned counted as the 2nd); 'players' checks playersGameType and
    // needs exactly 2 players in the round, regardless of team assignment —
    // this lets players and teams run completely different game formats at
    // once.
    let sides = null;
    if (mode === 'teams'){
      if (state.teamGameType !== 'Matchplay') return null;
      const effectiveSides = getEffectiveTeamSides();
      if (effectiveSides.length === 2) sides = effectiveSides.map(t=>({ label: t.name, members: t.members }));
    } else {
      if (state.playersGameType !== 'Matchplay') return null;
      if (state.players.length === 2) sides = state.players.map(p=>({ label: p.name, members: [p] }));
    }
    if (!sides || !sides[0].members.length || !sides[1].members.length) return null;

    const numHolesVal = state.numHoles;
    const holesData = state.holes;
    const sidePointsPerHole = sides.map(side=>{
      const perHole = [], played = [];
      for (let i=0;i<numHolesVal;i++){
        let best = -Infinity, any = false;
        side.members.forEach(p=>{
          const g = p.scores[i];
          if (g === undefined || g === null) return;
          any = true;
          const strokes = strokesReceived(p.hcp, holesData[i].si, numHolesVal);
          const pts = pointsForNet(g - strokes, holesData[i].par);
          if (pts > best) best = pts;
        });
        perHole.push(any ? best : 0);
        played.push(any);
      }
      return { perHole, played };
    });

    // Track the FIRST hole (if any) where the match becomes mathematically
    // won — margin bigger than the holes left to play. Once that happens,
    // the result is fixed forever at that hole's margin/holes-left, even if
    // players keep entering scores on the remaining holes for Stableford.
    let tally = 0, thru = 0;
    const tallyPerHole = [];
    let decidedAtHole = -1, decidedTally = 0, decidedHolesLeft = 0;
    for (let i=0;i<numHolesVal;i++){
      if (sidePointsPerHole[0].played[i] && sidePointsPerHole[1].played[i]){
        thru = i + 1;
        if (sidePointsPerHole[0].perHole[i] > sidePointsPerHole[1].perHole[i]) tally++;
        else if (sidePointsPerHole[1].perHole[i] > sidePointsPerHole[0].perHole[i]) tally--;
        if (decidedAtHole === -1){
          const holesLeft = numHolesVal - (i + 1);
          if (Math.abs(tally) > holesLeft){
            decidedAtHole = i;
            decidedTally = tally;
            decidedHolesLeft = holesLeft;
          }
        }
      }
      tallyPerHole.push(tally);
    }
    const label = (t)=> t === 0 ? 'AS' : (t > 0 ? `${t}UP` : `${-t}DN`);
    const sideOf = (p)=>{
      if (sides[0].members.includes(p)) return 0;
      if (sides[1].members.includes(p)) return 1;
      return -1;
    };
    // freeze=true (Scores tab, Leaderboard): once decided, keep repeating
    // that same frozen result for every hole from then on.
    // freeze=false (Scorecard): only show the result on the exact hole it
    // was decided; every hole after that returns {blank:true} so the caller
    // can render a plain cell with no matchplay decoration.
    const statusAt = (holeIdx, side, mode, freeze)=>{
      if (decidedAtHole !== -1 && holeIdx > decidedAtHole){
        if (!freeze) return { blank: true };
        return matchStatusText(decidedTally, decidedHolesLeft, side, mode);
      }
      if (decidedAtHole !== -1 && holeIdx === decidedAtHole){
        return matchStatusText(decidedTally, decidedHolesLeft, side, mode);
      }
      const t = tallyPerHole[holeIdx];
      const holesLeft = numHolesVal - (holeIdx + 1);
      return matchStatusText(t, holesLeft, side, mode);
    };
    return { sides, tallyPerHole, thru, finalTally: tally, label, sideOf, statusAt, numHolesVal, decidedAtHole, decidedTally, decidedHolesLeft };
  }

  function scoreEventMessage(gross, par){
    if (gross === 1) return 'Hole in 1! Bosh!!!';
    const diff = gross - par;
    if (diff <= -3) return 'Albatross! Hero!';
    if (diff === -2) return 'Eagle! Legend!';
    if (diff === -1) return 'Birdie! Awesome!';
    return null;
  }

  // Ranks players by total Stableford points across the whole competition —
  // every finished round plus whatever's live right now. Same aggregation the
  // Leaderboard tab uses, just factored out so the 9/18-hole milestone update
  // can use it too.
  function computeOverallPointsRanking(){
    const totals = {};
    state.completedRounds.forEach(round=>{
      round.entries.forEach(e=>{
        if (!totals[e.name]) totals[e.name] = { name: e.name, pts: 0 };
        totals[e.name].pts += e.pts;
      });
    });
    state.players.forEach(p=>{
      const { pts } = playerTotals(p);
      if (!totals[p.name]) totals[p.name] = { name: p.name, pts: 0 };
      totals[p.name].pts += pts;
    });
    return Object.values(totals).sort((a,b)=> b.pts - a.pts);
  }

  // Builds any newly-earned notifications for one specific hole, from that
  // hole's scores and tick boxes — but only if enough players have posted a
  // score on it: everyone, if there are 4 or fewer players in the round, or
  // at least 2 players if there are more than 4. This only ever runs when the
  // user navigates away from a hole (swiping or tapping ‹ / ›), not while
  // they're still sitting on it, so nobody sees a reveal mid-hole. Each
  // notification is only ever generated once (tracked by its own key).
  function generateAutoNotifications(holeIndex){
    if (state.players.length === 0) return;
    if (holeIndex === undefined || holeIndex < 0 || holeIndex >= state.numHoles) return;
    const existingKeys = new Set(state.notifications.map(n => n.key));
    const addNotification = (key, message) => {
      if (existingKeys.has(key)) return;
      existingKeys.add(key);
      state.notifications.push({ key, message, ts: Date.now() });
    };

    const i = holeIndex;

    // 9-hole and full-round leaderboard snapshots — these always require
    // EVERY player to have posted on that hole (not the 2-player threshold
    // used for the score/flag call-outs below), since it's meant to be a
    // simultaneous reveal for the whole group. Skipped entirely in
    // Matchplay, since a Stableford points leader/loser summary doesn't fit
    // a head-to-head match.
    if ((i === 8 || i === state.numHoles - 1) && state.playersGameType !== 'Matchplay' && state.teamGameType !== 'Matchplay'){
      const milestoneKey = i === 8 ? 'milestone:9' : `milestone:${state.numHoles}`;
      const allIn = state.players.every(p => p.scores[i] !== undefined && p.scores[i] !== null);
      if (allIn && !existingKeys.has(milestoneKey)){
        let dayLeader = null, dayBest = -Infinity;
        state.players.forEach(p=>{
          const { pts } = playerTotals(p);
          if (pts > dayBest){ dayBest = pts; dayLeader = p.name; }
        });
        const overall = computeOverallPointsRanking();
        const overallLeader = overall.length ? overall[0].name : '—';
        const overallLoser = overall.length ? overall[overall.length - 1].name : '—';
        const label = i === 8 ? '9 Hole Update' : `${state.numHoles} Hole Update`;
        const msg = `🚩 ${label}!\nCurrent day leader is ${dayLeader}\nCurrent overall leader is ${overallLeader}\nCurrent overall loser is ${overallLoser} 😞💩`;
        addNotification(milestoneKey, msg);
      }
    }

    // Matchplay notifications — gated by both sides of the match having
    // played this specific hole (mp.thru > i), not the generic Stableford
    // player-count threshold below, since a 1v1 match has its own natural
    // reveal point. Runs once for teams and once for players, independently,
    // since either or both could be running Matchplay at once.
    ['teams', 'players'].forEach(mode=>{
      const gt = mode === 'teams' ? state.teamGameType : state.playersGameType;
      if (gt !== 'Matchplay') return;
      const mp = computeLiveMatchplay(mode);
      if (!mp || mp.thru <= i) return;
      const keyPrefix = mode === 'teams' ? 'tmp' : 'pmp';
      const tally = mp.tallyPerHole[i];
      const holesLeft = mp.numHolesVal - (i + 1);

      // First time either side reaches 3 up — once per side, ever, this round.
      if (Math.abs(tally) === 3){
        const upSide = tally > 0 ? 0 : 1;
        addNotification(`${keyPrefix}:3up:${mp.sides[upSide].label}`, `${mp.sides[upSide].label} goes 3 UP! 🔥`);
      }

      // First time the match goes Dormy — it's a shared state (both sides
      // are Dormy at once), so just one notification, once per round.
      if (tally !== 0 && Math.abs(tally) === holesLeft){
        const upSide = tally > 0 ? 0 : 1;
        const dnSide = 1 - upSide;
        addNotification(`${keyPrefix}:dormy`, `${mp.sides[upSide].label} is Dormy vs ${mp.sides[dnSide].label}! ⛳`);
      }

      // Match result — win or draw, once ever per round.
      if (mp.decidedAtHole === i){
        const winSide = mp.decidedTally > 0 ? 0 : 1;
        const status = mp.statusAt(i, winSide, 'rich', true);
        addNotification(`${keyPrefix}:result`, `${mp.sides[winSide].label} ${status.text}! 🏆`);
      } else if (i === mp.numHolesVal - 1 && tally === 0 && mp.decidedAtHole === -1){
        addNotification(`${keyPrefix}:result`, `Match drawn — All Square! 🤝`);
      }

      // 9-hole matchplay status, replacing the generic Stableford one above.
      if (i === 8){
        const t9 = mp.tallyPerHole[8];
        const text9 = t9 === 0 ? 'All Square' : `${mp.sides[t9 > 0 ? 0 : 1].label} ${Math.abs(t9)} UP`;
        addNotification(`${keyPrefix}:thru9`, `🚩 Thru 9: ${text9}`);
      }
    });

    const threshold = state.players.length > 4 ? 2 : state.players.length;
    const hole = state.holes[i];
    const enteredCount = state.players.filter(p => p.scores[i] !== undefined && p.scores[i] !== null).length;
    if (enteredCount < threshold) return;

    state.players.forEach(p=>{
      const g = p.scores[i];
      if (g === undefined || g === null) return;

      const scoreMsg = scoreEventMessage(g, hole.par);
      if (scoreMsg){
        // Rank this among the player's under-par holes so far this round (in hole
        // order). The 1st under-par hole gets a one-time bonus line; every one
        // after that gets a running "N under par holes! Cheat! Cheat!" instead.
        let underParRank = 0;
        for (let j = 0; j <= i; j++){
          const gj = p.scores[j];
          if (gj === undefined || gj === null) continue;
          if (scoreEventMessage(gj, state.holes[j].par)) underParRank++;
        }
        const suffix = underParRank === 1
          ? 'One shot penalty - Lovely!'
          : `${underParRank} under par holes! Cheat! Cheat!`;
        addNotification(`${i}:${p.id}:score`, `${p.name}: ${scoreMsg} ${suffix}`);
      }

      const flags = p.flags && p.flags[i];
      if (flags){
        if (flags.penalty) addNotification(`${i}:${p.id}:penalty`, `Penalty shot to ${p.name}`);
        if (flags.lostBall) addNotification(`${i}:${p.id}:lostBall`, `Lost Ball for ${p.name}, Loser!`);
        if (flags.oob) addNotification(`${i}:${p.id}:oob`, `${p.name} Out of bounds! Shot Shot Blob is on the cards!`);
        if (flags.kieroning) addNotification(`${i}:${p.id}:kieroning`, `Kieroning incident reported for player ${p.name} - Committee to discuss cheating to be opened post round`);
      }
    });
  }

  function scoreClass(gross, par){
    const cat = scoreBadgeCategory(gross, par);
    return cat ? 'sc-' + cat : '';
  }

  // Score badge categories for the Enter Scores tab
  const BADGE_META = {
    albatross: { shape:'circle',   rings:3, bg:'#D9BB5E' }, // muted gold
    eagle:     { shape:'circle',   rings:2, bg:'#8FB4C9' }, // muted blue
    birdie:    { shape:'circle',   rings:1, bg:'#93BA9B' }, // muted green
    par:       { shape:null,       rings:0, bg:'#FFFFFF' }, // white, no ring
    bogey:     { shape:'square',   rings:1, bg:'#F0EA00' }, // yellow (240,234,0)
    double:    { shape:'square',   rings:2, bg:'#DFA372' }, // muted orange
    triple:    { shape:'triangle', rings:1, bg:'#C98A7D' }, // muted red
  };
  // Colour-blind-safe badge palette. Shape (circle/square/triangle) and ring
  // count already carry the primary meaning — good vs bad, how good/bad — so
  // colour here is a reinforcing cue, chosen from hues that stay distinct
  // under red/green colour blindness instead of the green-vs-brown pairing
  // "birdie" and "triple" use above.
  const BADGE_META_CB = {
    albatross: { shape:'circle',   rings:3, bg:'#0072B2' }, // blue
    eagle:     { shape:'circle',   rings:2, bg:'#56B4E9' }, // sky blue
    birdie:    { shape:'circle',   rings:1, bg:'#009E73' }, // bluish green
    par:       { shape:null,       rings:0, bg:'#FFFFFF' }, // white, no ring
    bogey:     { shape:'square',   rings:1, bg:'#F0E442' }, // yellow
    double:    { shape:'square',   rings:2, bg:'#E69F00' }, // orange
    triple:    { shape:'triangle', rings:1, bg:'#D55E00' }, // vermillion
  };
  function getBadgeMeta(){ return state.colorBlindMode ? BADGE_META_CB : BADGE_META; }
  const RING_SIZES = { 1:[34], 2:[42,32], 3:[48,39,30] };
  const RING_SIZES_MINI = { 1:[19], 2:[24,17], 3:[26,20,14] };

  function scoreBadgeCategory(gross, par){
    if (gross === undefined || gross === null) return null;
    if (gross === 1) return 'hole1';
    const diff = gross - par;
    if (diff <= -3) return 'albatross';
    if (diff === -2) return 'eagle';
    if (diff === -1) return 'birdie';
    if (diff === 0) return 'par';
    if (diff === 1) return 'bogey';
    if (diff === 2) return 'double';
    return 'triple';
  }

  // Flag tick box: blank at 0, a red tick at 1, the tap count itself from 2 up.
  function flagSquareHtml(count){
    if (count >= 2) return `<span class="flag-sq flag-sq-count">${count}</span>`;
    if (count === 1) return `<span class="flag-sq flag-sq-tick"></span>`;
    return `<span class="flag-sq"></span>`;
  }

  function buildScoreBadgeHTML(gross, par, editable){
    const cat = scoreBadgeCategory(gross, par);
    const value = (gross !== undefined && gross !== null) ? gross : '';
    const numHtml = editable
      ? `<input type="number" inputmode="numeric" class="sb-input" value="${value}">`
      : `<span class="sb-num">${gross}</span>`;
    if (!cat){
      if (editable) return `<div class="score-badge sb-empty"><input type="number" inputmode="numeric" class="sb-input sb-input-empty" value=""></div>`;
      return `<div class="score-badge sb-empty">–</div>`;
    }
    if (cat === 'hole1'){
      const oneHtml = editable
        ? `<input type="number" inputmode="numeric" class="sb-input sb-input-hole1" value="1">`
        : `<span class="sb-num-hole1">1</span>`;
      return `<div class="score-badge sb-hole1">
        <span class="sb-spark sb-spark-1">✦</span>
        <span class="sb-spark sb-spark-2">✦</span>
        <span class="sb-spark sb-spark-3">✦</span>
        <span class="sb-spark sb-spark-4">✦</span>
        ${oneHtml}
      </div>`;
    }
    const meta = getBadgeMeta()[cat];
    let ringsHtml = '';
    if (meta.shape === 'circle' || meta.shape === 'square'){
      const cls = meta.shape === 'circle' ? 'sb-ring-circle' : 'sb-ring-square';
      ringsHtml = RING_SIZES[meta.rings].map(s =>
        `<span class="sb-ring ${cls}" style="width:${s}px;height:${s}px;"></span>`
      ).join('');
    } else if (meta.shape === 'triangle'){
      ringsHtml = `<svg class="sb-triangle" viewBox="0 0 60 60"><polygon points="30,9 53,49 7,49"></polygon></svg>`;
    }
    return `<div class="score-badge sb-box" style="background:${meta.bg};">${ringsHtml}${numHtml}</div>`;
  }

    const chatBox = document.createElement('div');

    if (state.players.length === 0){

      state.players.forEach(p=>{

        opt.value = p.name;
        opt.textContent = p.name;
        if (state._chatSenderName === p.name) opt.selected = true;
        senderSelect.appendChild(opt);
      });
      if (!state._chatSenderName) state._chatSenderName = state.players[0].name;
    }
    senderSelect.onchange = (e)=>{ state._chatSenderName = e.target.value; };
    chatBox.appendChild(senderSelect);

    const chatRow = document.createElement('div');
    chatRow.className = 'chat-row';
    const chatInput = document.createElement('input');
    chatInput.type = 'text';
    chatInput.placeholder = 'Say something…';
    chatInput.className = 'chat-input';
    chatInput.autocomplete = 'off';
    let draft = '';
    chatInput.oninput = (e)=>{ draft = e.target.value; }; // no render() here — keeps the keyboard/focus stable
    const sendMessage = ()=>{
      const text = draft.trim();
      if (!text) return;
      const from = state._chatSenderName || 'Someone';
      state.notifications.push({ key: `chat:${uid()}`, message: `${from}: ${text}`, ts: Date.now() });
      state._lastSeenNotifCount = state.notifications.length;
      draft = '';
      render();
    };
    chatInput.onkeydown = (e)=>{ if (e.key === 'Enter'){ e.preventDefault(); sendMessage(); } };
    chatRow.appendChild(chatInput);

    const sendBtn = document.createElement('button');
    sendBtn.className = 'chat-send';
    sendBtn.textContent = 'Send';
    sendBtn.onclick = sendMessage;
    chatRow.appendChild(sendBtn);

    chatBox.appendChild(chatRow);
    return chatBox;
  }

  function renderPlayersTab(){
    const wrap = document.createElement('div');

    // Players — same format as it used to be in Round Setup
    const ptitle = document.createElement('div');
    ptitle.className = 'section-title';
    ptitle.style.marginTop = '0';
    ptitle.textContent = 'Players';
    wrap.appendChild(ptitle);

    if (state.players.length === 0){
      const emptyP = document.createElement('div');
      emptyP.className = 'hint';
      emptyP.textContent = 'Add players below with their playing handicap.';
      wrap.appendChild(emptyP);
    }

    // All team boxes share ONE width, computed once (not per-player), so the
    // column lines up cleanly instead of each row being a different width.
    // Defaults to whatever "Unassigned" needs; grows to fit the longest
    // actual team name if that's bigger; capped at ~1/3 of the card, beyond
    // which a name wraps onto another line (taller box) instead of the
    // column growing further.
    const CARD_MAX_W = 118; // ~1/3 of the player-card's usable width on a phone screen
    const EXTRA_PAST_ARROW = 11; // ~3mm of colour continuing past the arrow's white patch
    let sharedTeamBoxWidth = 0;
    if (state.teams.length > 0){
      const namesToFit = ['Unassigned', ...state.teams.map(t=>t.name)];
      let maxNeeded = 0;
      namesToFit.forEach(name=>{
        const w = measureTextPx(name, '700 11px -apple-system, BlinkMacSystemFont, sans-serif');
        maxNeeded = Math.max(maxNeeded, Math.ceil(w) + 30 + EXTRA_PAST_ARROW);
      });
      sharedTeamBoxWidth = Math.min(maxNeeded, CARD_MAX_W + EXTRA_PAST_ARROW);
    }

    // Auto-group by team as soon as it's picked — same team-then-name sort
    // used on the Scores/Scorecard tabs, so this list re-clusters instantly
    // rather than staying in original add-order.
    const { list: orderedPlayers } = getGroupedPlayers();

    let idx = 0;
    while (idx < orderedPlayers.length){
      const p = orderedPlayers[idx];
      const teamId = (p.teamId && state.teams.some(t=>t.id === p.teamId)) ? p.teamId : null;
      let j = idx;
      while (j < orderedPlayers.length && ((orderedPlayers[j].teamId && state.teams.some(t=>t.id===orderedPlayers[j].teamId)) ? orderedPlayers[j].teamId : null) === teamId){
        j++;
      }
      const group = orderedPlayers.slice(idx, j);
      const team = teamId ? state.teams.find(t=>t.id === teamId) : null;

      // A solid ring in the team's own colour around the whole cluster —
      // applies even when a team has just one player in it so far, since
      // the point is to show "this is a team", not just "these players are
      // grouped".
      let target = wrap;
      if (team){
        target = document.createElement('div');
        target.className = 'team-group-wrap';
        target.style.border = `11px solid ${team.color}`;
        wrap.appendChild(target);
      }

      group.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'player-card player-card-line';

      const content = document.createElement('div');
      content.className = 'pc-content';

        gameField.appendChild(gameSelect);

      wrap.appendChild(gameField);

      // Warnings scoped to teams: Matchplay needs exactly 2 teams (or 1 team

      if (state.teamGameType === 'Matchplay' && !computeLiveMatchplay('teams')){
        wrap.appendChild(buildGameConfigWarning('Matchplay is only for two teams. Please select an alternative game, like Skins or Split Sixes.'));
      } else if (state.teamGameType === 'Split Sixes' && !computeLiveSplitSixes('teams')){
        wrap.appendChild(buildGameConfigWarning('Split Sixes is only for three teams. Please select an alternative game, like Matchplay or Skins.'));
      }

    favTitle.innerHTML = `Player Favourites <span class="pc-heart pc-heart-filled" style="cursor:default;font-size:15px;">\u2665</span>`;
    wrap.appendChild(favTitle);

    if (state._favSaveError){
      const favErrBox = document.createElement('div');
      favErrBox.style.background = 'rgba(193,68,60,0.12)';
      favErrBox.style.border = '1.5px solid var(--flag)';
      favErrBox.style.borderRadius = '8px';
      favErrBox.style.padding = '10px 12px';
      favErrBox.style.marginBottom = '10px';
      favErrBox.style.fontSize = '12px';
      favErrBox.style.color = 'var(--flag)';
      favErrBox.style.lineHeight = '1.4';
      favErrBox.textContent = `Favourites can't be saved on this device right now: ${state._favSaveError}. They'll disappear when you close the app.`;
      wrap.appendChild(favErrBox);

    const addFavBtn = document.createElement('button');
    addFavBtn.className = 'btn btn-primary';
    addFavBtn.style.marginBottom = '10px';

      state.favourites.forEach(f=>{

          state.players.push({
            id: uid(), name: f.name, hcp: f.hcp,
            color: getSwatches()[state.players.length % getSwatches().length],
            teamId: null,
            scores: {},
            favId: f.id,
          });
          f.ticked = false;
        }
      });
      savePlayerFavourites();
      render();
    };
    wrap.appendChild(addFavBtn);

    if (state.favourites.length === 0){
      const favHint = document.createElement('div');
      favHint.className = 'hint';
      favHint.textContent = 'No favourites yet — tap the heart next to any player above to save them here.';
      wrap.appendChild(favHint);

          state.players.forEach(p=>{ if (p.favId === f.id) p.favId = null; });
          savePlayerFavourites();
          render();

        nameSpan.className = 'pc-name';
        nameSpan.contentEditable = 'true';
        nameSpan.spellcheck = false;
        nameSpan.textContent = f.name;
        nameSpan.addEventListener('blur', (e)=>{
          const v = e.target.textContent.trim();
          if (v && v !== f.name){ f.name = v; savePlayerFavourites(); render(); }
          else if (!v){ e.target.textContent = f.name; }
        });
        nameSpan.addEventListener('keydown', (e)=>{
          if (e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
        });
        content.appendChild(nameSpan);

        const addWrap = document.createElement('div');
        addWrap.className = 'pc-hcp-wrap';
        addWrap.style.marginRight = '10px';
        addWrap.innerHTML = `<span class="pc-field-label">Add Players</span>`;
        const addTick = document.createElement('span');
        addTick.className = 'flag-sq' + (f.ticked ? ' flag-sq-tick' : '');
        addTick.style.cursor = 'pointer';
        addTick.onclick = ()=>{ f.ticked = !f.ticked; savePlayerFavourites(); render(); };
        addWrap.appendChild(addTick);
        content.appendChild(addWrap);

        const heart = document.createElement('span');
        heart.className = 'pc-heart pc-heart-filled';
        heart.textContent = '\u2665';
        heart.onclick = removeFavourite;
        content.appendChild(heart);

        const hcpWrap = document.createElement('div');
        hcpWrap.className = 'pc-hcp-wrap';
        hcpWrap.innerHTML = `<span class="pc-field-label">Hcp</span>`;
        const hcpInput = document.createElement('input');
        hcpInput.type = 'number';
        hcpInput.inputMode = 'decimal';
        hcpInput.step = '0.1';
        hcpInput.value = f.hcp;
        hcpInput.className = 'pc-hcp-input';
        hcpInput.onchange = (e)=>{
          const v = parseFloat(e.target.value);
          f.hcp = isNaN(v) ? 0 : v;
          savePlayerFavourites();
          render();
        };
        hcpWrap.appendChild(hcpInput);
        content.appendChild(hcpWrap);

        const rm = document.createElement('button');
        rm.className = 'remove';
        rm.textContent = 'Remove';
        rm.onclick = removeFavourite;
        content.appendChild(rm);

        card.appendChild(content);
        wrap.appendChild(card);
      });
    }

    return wrap;
  }
